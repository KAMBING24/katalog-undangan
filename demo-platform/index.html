<!DOCTYPE html>

<style>
:root{--ink:#2b1d4a;--sky:#5cb8ff;--sky2:#ffd9ec;--grass:#57c443;--dirt:#c8763c;--pink:#ff5c8a;--gold:#ffd23f;--card:#fff8e7;--u-ink:#2b1d4a;--u-bg:#fff8e7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'VT323',monospace;font-size:20px;line-height:1.15;color:var(--ink);background:#2b1d4a radial-gradient(circle 1.5px,#fff8 98%,transparent) 0 0/34px 34px;-webkit-font-smoothing:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#u-root{display:contents}
input,textarea,select{-webkit-user-select:text;user-select:text}
/* ===== langit & latar parallax (--x = posisi kamera) ===== */
.sky{position:absolute;inset:0;background:linear-gradient(var(--sky) 0 45%,#a6dcff 70%,var(--sky2));overflow:hidden}
.sun{position:absolute;right:12%;top:14%;width:56px;height:56px;background:#fff3a6;box-shadow:0 0 0 6px rgba(255,243,166,.45),0 0 0 14px rgba(255,243,166,.2)}
.game .sky::after{content:"";position:absolute;left:0;right:0;top:6%;height:60%;background:radial-gradient(circle 16px at 30px 40px,#fff 98%,transparent),radial-gradient(circle 22px at 56px 32px,#fff 98%,transparent),radial-gradient(circle 16px at 84px 42px,#fff 98%,transparent),radial-gradient(circle 11px at 260px 130px,rgba(255,255,255,.8) 98%,transparent),radial-gradient(circle 15px at 280px 122px,rgba(255,255,255,.8) 98%,transparent);background-size:360px 100%;background-repeat:repeat-x;background-position-x:calc(var(--x,0) * -.1px)}
.cl{position:absolute;width:96px;height:28px;background:#fff;box-shadow:16px -12px 0 #fff,40px -12px 0 #fff,56px 0 0 #fff,0 4px 0 #d6efff;animation:drift 30s linear infinite alternate}
.c1{top:16%;left:6%}.c2{top:30%;left:64%;scale:.8}.c3{top:46%;left:30%;scale:.6}
.mtn{position:absolute;left:0;right:0;bottom:72px;height:40%;opacity:.55;
  background:conic-gradient(from 135deg at 50% 0,#8fb3e8 90deg,transparent 0) calc(var(--x,0) * -.2px) 100%/260px 70% repeat-x}
.hills{position:absolute;left:0;right:0;bottom:72px;height:34%;
  background:radial-gradient(ellipse 120px 100px at 50% 100%,#3fa34a 97%,transparent 100%) calc(var(--x,0) * -.4px + 40px) 100%/300px 100% repeat-x,
             radial-gradient(ellipse 80px 66px at 50% 100%,#6fd36a 97%,transparent 100%) calc(var(--x,0) * -.6px) 100%/220px 70% repeat-x}
.grd{position:absolute;left:-600px;right:-600px;bottom:0;height:72px;
  background:linear-gradient(#7be05f 0 4px,var(--grass) 4px 12px,#2f8a2a 12px 16px,transparent 16px),
  linear-gradient(90deg,rgba(0,0,0,.2) 3px,transparent 3px) 0 16px/32px 32px,linear-gradient(rgba(0,0,0,.2) 3px,transparent 3px) 0 16px/32px 16px,var(--dirt)}
/* ===== cover = layar judul ===== */
/* selalu kolom portrait seperti HP (tema lain juga ±480px), juga di laptop/tablet */
.cover,.game{left:50%!important;right:auto!important;width:min(100%,480px);translate:-50% 0;box-shadow:0 0 0 4px var(--ink),0 0 60px rgba(0,0,0,.5)}
.cover{position:fixed;inset:0;z-index:60;overflow:hidden;transition:opacity .6s steps(4),visibility .6s}
.cover.hide{opacity:0;visibility:hidden}
.cover .hills{bottom:72px}
.ttl{position:relative;margin:max(8vh,30px) auto 0;text-align:center;padding:0 14px;max-width:480px}
.lv{font-family:'Press Start 2P';font-size:9px;line-height:1.6;letter-spacing:.06em}
.cover .lv{color:#fff;text-shadow:2px 2px 0 var(--ink)}
.nmz{font-family:'Press Start 2P';font-weight:400;font-size:clamp(19px,6.4vw,30px);line-height:1.35;color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);margin:10px 0 6px}
.nmz i{color:var(--pink);font-style:normal;margin:0 .2em;display:inline-block;animation:beat 1s steps(2) infinite}
.dt{font-family:'Press Start 2P';font-size:11px;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.to{font-family:'Press Start 2P';font-size:9px;color:#fff;text-shadow:2px 2px 0 var(--ink);margin-top:26px}
.gn{font-size:28px;color:#fff;text-shadow:2px 2px 0 var(--ink);margin:2px 0 4px}
.hint{font-family:'Press Start 2P';font-size:7px;line-height:1.8;color:#fff;margin-top:12px;text-shadow:1px 1px 0 var(--ink)}
.blink{animation:blink 1s steps(2) infinite}
.cgate{position:absolute;left:50%;bottom:72px;translate:-50% 0;width:200px;height:170px}
.cgate .gate{left:0;bottom:0}.cgate .duo{left:58px;bottom:0}
/* ===== panggung game ===== */
.game{position:fixed;inset:0;overflow:hidden;touch-action:none}
.world{position:absolute;left:0;top:0;bottom:0;will-change:translate}
.hud{position:absolute;left:0;right:0;top:0;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:8px 62px 6px 10px;font-family:'Press Start 2P';font-size:7px;color:#fff;text-shadow:2px 2px 0 var(--ink);background:linear-gradient(rgba(43,29,74,.45),transparent)}
.hud>span{display:flex;flex-direction:column;gap:3px}.hud .hm{flex-direction:row;align-items:center;gap:4px;font-size:9px}.hud>span:nth-child(3){text-align:right}
.hud b{font-weight:400;font-size:10px;color:var(--gold);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:130px}
.mini{grid-column:1/-1;position:relative;height:6px;background:rgba(43,29,74,.5);border:2px solid #fff;margin-top:2px}
.mini i{position:absolute;top:-1px;width:4px;height:4px;background:var(--gold)}
.mini .me{position:absolute;top:-4px;width:10px;height:10px;margin-left:-5px;background:var(--pink);border:2px solid #fff;max-width:none}
.music{top:8px!important;bottom:auto!important;right:max(10px,calc(50% - 230px))!important;width:40px!important;height:40px!important;border-radius:0!important;border:3px solid #fff!important;background:var(--ink)!important;color:#fff!important;z-index:7!important}
/* ===== sprite pasangan ===== */
.duo{position:absolute;left:0;bottom:72px;width:84px;height:64px;z-index:4;will-change:translate}
.ch{position:absolute;bottom:0;width:40px;height:64px}.ch svg{position:absolute;inset:0;width:100%;height:100%}
.ch.g{left:42px}.ch.b{left:0}.ch .fb{visibility:hidden}
.duo.run .ch .fa{animation:fa .24s steps(1) infinite}.duo.run .ch .fb{animation:fb .24s steps(1) infinite}.duo.run .ch.b svg{animation-delay:-.12s}
.duo.air .ch .fb{visibility:visible}.duo.air .ch .fa{visibility:hidden}
.duo.left .ch,.duo.left .cimg{scale:-1 1}.duo.left .ch.g{left:0}.duo.left .ch.b{left:42px}
.duo:not(.run):not(.air) .ch{animation:nod 1.2s steps(2) infinite}.duo:not(.run) .ch.b{animation-delay:-.6s}
.cimg{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;image-rendering:pixelated}
.say{position:absolute;left:-14px;bottom:78px;width:120px;padding:6px;background:#fff;border:3px solid var(--ink);font-family:'Press Start 2P';font-size:7px;line-height:1.6;text-align:center;animation:bob 1s steps(2) infinite;transition:opacity .3s}
.say::after{content:"";position:absolute;left:50px;bottom:-9px;width:10px;height:10px;background:#fff;border:3px solid var(--ink);border-top:0;border-left:0;rotate:45deg}
.say.off{opacity:0}
/* ===== tombol kontrol ===== */
.pad{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:space-between;padding:0 10px;pointer-events:none}
.pad>div{display:flex;gap:8px;pointer-events:auto}
.pad button{width:56px;height:56px;font-family:'Press Start 2P';font-size:18px;color:#fff;background:rgba(43,29,74,.82);border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:pointer;touch-action:none}
.pad button.dn,.pad button:active{translate:0 3px;box-shadow:0 1px 0 rgba(0,0,0,.35);background:var(--pink)}
.pad .auto{font-size:8px;width:52px}.pad .auto.on{background:var(--gold);color:var(--ink)}
.pad .actb{width:auto;padding:0 12px;font-size:10px;background:var(--pink);animation:beat .8s steps(2) infinite}
.pad .actb[hidden]{display:none}
/* ===== benda darat ===== */
.ob,.brk,.blk,.hc,.bush,.flw{position:absolute;display:block}
.ob{bottom:72px;z-index:1;font-family:'Press Start 2P';font-size:8px;color:#fff}
.sign{width:96px;height:96px}
.sign::before,.post::before{content:"";position:absolute;left:44px;bottom:0;width:8px;height:56px;background:#7a4a24;border:2px solid var(--ink)}
.sign b,.post b{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;justify-content:center;background:#b36a2c;border:4px solid var(--ink);box-shadow:inset 0 -4px 0 #7a4a24;font-weight:400;font-size:9px}
.post{width:76px;height:84px}.post::before{left:34px;height:46px}
.gate{width:200px;height:170px}
.gate::before,.gate::after{content:"";position:absolute;bottom:0;width:18px;height:130px;background:#fff;border:4px solid var(--ink);box-shadow:inset -4px 0 0 #e5d6f0}
.gate::before{left:0}.gate::after{right:0}
.gate b{position:absolute;left:-6px;right:-6px;top:0;height:46px;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid var(--ink);border-radius:60px 60px 0 0;color:var(--pink);font-weight:400;font-size:9px;box-shadow:0 -6px 0 -2px var(--pink),inset 0 -4px 0 #f2d6e2}
.flag{width:60px;height:180px}.flag::before{content:"";position:absolute;left:0;bottom:0;width:6px;height:180px;background:#eee;border:2px solid var(--ink)}
.flag b{position:absolute;left:8px;top:6px;width:48px;height:32px;background:var(--pink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:400;font-size:14px;animation:wave .6s steps(2) infinite}
.brk{bottom:168px;height:22px;background:#d1663a;border:3px solid var(--ink);background-image:linear-gradient(90deg,var(--ink) 3px,transparent 3px),linear-gradient(var(--ink) 3px,transparent 3px);background-size:24px 22px,24px 11px;background-position:-3px 0,0 -3px}
.blk{bottom:222px;width:40px;height:40px;background:var(--pink);border:4px solid var(--ink);box-shadow:inset -5px -5px 0 #c2305e,inset 4px 4px 0 #ffb0c8;display:flex;align-items:center;justify-content:center;font-style:normal}
.blk b{font-size:16px;font-weight:400;color:#fff;text-shadow:2px 2px 0 #8e1d43;font-family:'Press Start 2P'}
.blk.bump{animation:bump .3s steps(3)}
.blk.bump::after{content:"♥";position:absolute;left:8px;top:-8px;font-size:18px;color:var(--pink);text-shadow:2px 2px 0 var(--ink);animation:pop .7s steps(5) forwards}
.hc{font-style:normal;font-size:22px;color:var(--pink);text-shadow:2px 2px 0 var(--ink);animation:bob 1s steps(2) infinite}
.hc.got{animation:collect .45s steps(4) forwards}
.bush{bottom:72px;width:64px;height:30px;background:radial-gradient(circle 16px at 16px 22px,#3fa34a 98%,transparent),radial-gradient(circle 18px at 34px 16px,#4cb84a 98%,transparent),radial-gradient(circle 14px at 50px 22px,#3fa34a 98%,transparent)}
.flw{bottom:72px;width:30px;height:16px;background:radial-gradient(circle 4px at 5px 6px,#ffd23f 98%,transparent),radial-gradient(circle 4px at 15px 4px,#ff8ab0 98%,transparent),radial-gradient(circle 4px at 25px 7px,#fff 98%,transparent)}
/* ===== benda langit: menyatu dengan dunia ===== */
.sk{position:absolute;bottom:250px;z-index:2;opacity:0}
.sk.hi{bottom:290px}.sk.lo{bottom:236px}
.sk.seen{animation:drop .9s steps(6) both}
.sk.seen>*{animation:float 3s steps(3) infinite alternate}
.cld{position:relative;width:min(290px,80vw);padding:16px 16px 14px;text-align:center;background:#fff;border:4px solid #fff;box-shadow:0 0 0 3px #d8eeff,6px 8px 0 rgba(43,29,74,.18);scrollbar-width:none}
.cld::-webkit-scrollbar{display:none}
.sk>.cld::before{content:"";position:absolute;left:30px;right:30px;bottom:-18px;height:20px;background:radial-gradient(circle 14px at 20px 4px,#fff 98%,transparent),radial-gradient(circle 18px at 50% 2px,#fff 98%,transparent),radial-gradient(circle 13px at calc(100% - 18px) 4px,#fff 98%,transparent)}
.sk>.cld::after{content:"";position:absolute;left:18px;right:18px;top:-26px;height:24px;background:radial-gradient(circle 20px at 30px 24px,#fff 98%,transparent),radial-gradient(circle 26px at 50% 26px,#fff 98%,transparent),radial-gradient(circle 18px at calc(100% - 26px) 24px,#fff 98%,transparent)}
.cld.title{width:min(320px,86vw)}.cld.title .nmz{font-size:clamp(16px,5vw,22px)}
.cld .lv{color:#8a6aa8;margin-bottom:6px}
.qt,.kv{font-size:20px;line-height:1.2}.sr{font-family:'Press Start 2P';font-size:7px;margin-top:8px;color:#8a6aa8}
.big{font-family:'Press Start 2P';font-size:15px;color:var(--pink);text-shadow:2px 2px 0 var(--ink);margin-bottom:8px}
.nmz.sm{font-size:clamp(13px,4vw,17px)!important}
.story h3{font-family:'Press Start 2P';font-weight:400;font-size:9px;line-height:1.6;margin:4px 0}.story .yr{font-family:'Press Start 2P';font-size:13px;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.calc{width:min(270px,78vw)}
/* pesawat kertas + spanduk */
.plane{display:flex;align-items:center;bottom:300px}
.pl{font-size:34px;color:#fff;text-shadow:2px 2px 0 var(--ink);order:2;rotate:-8deg}
.ban{width:min(300px,78vw);padding:10px 16px;background:var(--gold);border:3px solid var(--ink);clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);text-align:center;font-size:19px;line-height:1.15}
/* balon udara mempelai */
.pair{display:flex;align-items:flex-start;gap:6px;bottom:236px}
.bal{width:150px;display:flex;flex-direction:column;align-items:center}
.bal.p2{margin-top:40px}
.env{width:126px;height:136px;border-radius:50% 50% 46% 46%;border:4px solid var(--ink);overflow:hidden;position:relative;background:repeating-linear-gradient(90deg,var(--pink) 0 20px,#fff 20px 40px)}
.bal.p2 .env{background:repeating-linear-gradient(90deg,#5cb8ff 0 20px,#fff 20px 40px)}
.env img{position:absolute;left:19px;top:20px;width:80px;height:92px;object-fit:cover;border:3px solid var(--ink);border-radius:40px 40px 6px 6px}
.rope{display:block;width:60px;height:22px;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.bsk{width:150px;padding:6px;background:#c27a32;border:3px solid var(--ink);box-shadow:inset 0 -4px 0 #8a5022;color:#fff8e7;text-align:center}
.bsk h3{font-family:'Press Start 2P';font-weight:400;font-size:8px;line-height:1.5}.bsk p{font-size:16px;line-height:1.1}.bsk a{color:var(--gold);font-size:16px}
.hrt{font-style:normal;font-size:24px;color:var(--pink);text-shadow:2px 2px 0 var(--ink);align-self:center;animation:beat 1s steps(2) infinite}
/* awan papan skor */
.count{display:flex;justify-content:center;gap:5px;margin:8px 0 4px}.count div{background:var(--ink);border:3px solid var(--gold);min-width:54px;padding:5px 0 3px;color:var(--gold)}
.count b{display:block;font-family:'Press Start 2P';font-weight:400;font-size:13px;line-height:1.3}.count span{font-family:'Press Start 2P';font-size:6px;color:#9fe3ff}
/* pulau melayang */
.isl{bottom:236px;width:min(280px,80vw);display:flex;flex-direction:column;align-items:center}
.bb{width:100%;padding:12px;background:#fff8e7;border:4px solid var(--ink);box-shadow:inset 0 0 0 3px #f1c27d;text-align:center;font-size:19px;line-height:1.15;margin-bottom:-4px;position:relative;z-index:1}
.bb .tm{font-family:'Press Start 2P';font-size:12px;margin:4px 0;color:var(--pink)}
.land{position:relative;width:86%;height:46px;background:linear-gradient(#7be05f 0 6px,var(--grass) 6px 14px,var(--dirt) 14px);border:4px solid var(--ink);clip-path:polygon(0 0,100% 0,100% 40%,88% 40%,88% 70%,70% 70%,70% 100%,30% 100%,30% 70%,12% 70%,12% 40%,0 40%)}
.chest{position:absolute;left:50%;bottom:calc(100% - 4px);width:56px;height:44px;margin-left:-28px;background:#9a5a22;border:4px solid var(--ink);box-shadow:inset 0 14px 0 #c27a32,inset 0 -6px 0 #6e3c14;cursor:pointer}
.chest::after{content:"";position:absolute;left:18px;top:10px;width:12px;height:14px;background:var(--gold);border:2px solid var(--ink)}
.isl .chest{position:relative;left:auto;bottom:auto;margin:6px auto -4px;display:block}
.chest-l{display:flex;flex-direction:column;align-items:center;width:86%}
/* kantor pos awan */
.post-o .house{position:relative;width:150px;height:110px;background:#fff8e7;border:4px solid var(--ink);margin:46px 0 -4px;cursor:pointer;box-shadow:inset 0 -6px 0 #f1c27d}
.house::before{content:"";position:absolute;left:-20px;right:-20px;top:-50px;height:46px;background:#e2463b;clip-path:polygon(50% 0,100% 100%,0 100%)}
.house b{position:absolute;left:12px;top:12px;padding:4px 6px;background:#e2463b;color:#fff;border:3px solid var(--ink);font-family:'Press Start 2P';font-weight:400;font-size:9px}
.house .door{position:absolute;right:20px;bottom:0;width:34px;height:52px;background:#7a4a24;border:3px solid var(--ink);border-bottom:0}
.pp1,.pp2{position:absolute;font-style:normal;font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--ink);animation:fly 4s steps(8) infinite}
.pp1{left:-10px;top:0}.pp2{right:-6px;top:40px;animation-delay:-2s}
/* layang-layang */
.kite{bottom:236px;display:flex;flex-direction:column;align-items:center;width:min(270px,78vw)}
.kt{display:block;width:56px;height:56px;rotate:45deg;background:conic-gradient(var(--pink) 0 25%,var(--gold) 0 50%,#5cb8ff 0 75%,#fff 0);border:4px solid var(--ink);margin-bottom:-6px;animation:kite 2s steps(2) infinite}
.str{display:block;width:2px;height:26px;background:var(--ink)}
.kp{width:100%;max-height:calc(100dvh - 420px);overflow:auto;padding:10px 12px;background:#fff;border:4px solid var(--ink);text-align:center;font-size:18px;line-height:1.15}
.kp h3{font-family:'Press Start 2P';font-weight:400;font-size:8px;margin-top:6px}.tix .kp{cursor:pointer;background:var(--gold)}
/* galeri: tali jemuran antara dua balon */
.line{bottom:250px;height:230px}
.lb{position:absolute;top:0;width:56px;height:64px;border-radius:50% 50% 46% 46%;border:4px solid var(--ink);background:var(--pink)}
.lb.l{left:0}.lb.r{right:0;background:#5cb8ff}
.lb::after{content:"";position:absolute;left:24px;top:60px;width:2px;height:48px;background:var(--ink)}
.tag{position:absolute;left:70px;top:8px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.str2{position:absolute;left:26px;right:26px;top:106px;height:24px;border-bottom:3px solid var(--ink);border-radius:0 0 50% 50%}
.pols{position:absolute;left:64px;top:120px;display:flex;gap:16px}
.pol{position:relative;width:80px;padding:5px 5px 16px;background:#fff;border:2px solid var(--ink);rotate:var(--r);cursor:pointer;box-shadow:3px 3px 0 rgba(43,29,74,.25);transform-origin:50% 0}
.pol::before{content:"";position:absolute;left:34px;top:-10px;width:8px;height:14px;background:#c27a32;border:2px solid var(--ink)}
.pol img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.sk.seen .pols{animation:none}.sk.seen .pol{animation:swing 2.4s steps(4) infinite alternate}
/* kapal udara */
.blimp{bottom:290px}
.zep{position:relative;width:230px;height:92px;border-radius:50%;background:linear-gradient(#d7d7e8,#a7a7c2);border:4px solid var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.zep::after{content:"";position:absolute;right:-22px;top:22px;width:28px;height:40px;background:var(--pink);clip-path:polygon(0 50%,100% 0,100% 100%)}

<script>
/* =====================================================================
   ENGINE UNDANGAN DIGITAL  —  logika bersama untuk semua tema
   Tema hanya bertugas menggambar HTML (render) + CSS.
   Engine mengurus: paket/fitur, nama tamu, hitung mundur, kalender,

===================================================================== */
(function () {
  /* ---------------- PAKET & FITUR ---------------- */
  const BASIC = ['quote', 'couple', 'events', 'gallery', 'rsvp'];
  const STANDAR = BASIC.concat(['details', 'story', 'gift', 'wishes', 'music', 'map', 'track']);
  const PREMIUM = STANDAR.concat(['livestream', 'video', 'qr']);

    basic:   { label: 'Basic',   features: BASIC,   galleryMax: 4 },

    expiredText: 'Masa aktif undangan ini telah berakhir. Terima kasih atas doa dan kehadirannya.',
    photoGrayscale: false
  };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ZONE = { 'Asia/Jakarta': 'WIB', 'Asia/Makassar': 'WITA', 'Asia/Jayapura': 'WIT' };

  const Undangan = {
    packages: PACKAGES,
    themes: {},
    register(name, theme) { this.themes[name] = theme; },

    /* Pecah teks elemen (yang cocok dengan selector) menjadi kata:
       <span class="w" style="--i:n;--r:±deg"><span class="wi">kata</span></span>
       Dipakai tema untuk animasi kata. `skip(el)` → true bila elemen dilewati. */
    splitWords(root, sel, skip) {
      root.querySelectorAll(sel).forEach(el => {
        if (el.querySelector('.w') || el.closest('.w') || (skip && skip(el))) return;
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        let i = 0;
        nodes.forEach(n => {
          if (!n.textContent.trim()) return;
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(part => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.append(' '); return; }
            const w = document.createElement('span'); w.className = 'w';
            w.style.setProperty('--i', i);
            w.style.setProperty('--r', ((i % 2 ? 1 : -1) * (1 + (i % 3) * .6)).toFixed(1) + 'deg');
            const inner = document.createElement('span'); inner.className = 'wi'; inner.textContent = part;
            w.append(inner); frag.append(w); i++;
          });
          n.replaceWith(frag);
        });
      });
    },

    /* DEMO SAJA: calon pembeli mencoba nama & tanggal sendiri lewat link ?n1=Budi&n2=Ani&tgl=2027-05-20.
       Semua teks yang memuat nama/tanggal lama diganti (nama lengkap, hashtag, rekening, tanggal acara).
       Tidak berlaku untuk undangan klien asli (C.demo kosong) → link klien tidak bisa diubah orang lain. */
    tryNames(C) {
      const q = new URLSearchParams(location.search);
      const clean = v => (v || '').replace(/[<>"&]/g, '').replace(/\s+/g, ' ').trim().slice(0, 24);
      const n1 = clean(q.get('n1')), n2 = clean(q.get('n2')), tgl = q.get('tgl') || '';
      const reps = [];
      const fmt = iso => new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: C.timezone }).format(new Date(iso));
      if (/^\d{4}-\d{2}-\d{2}$/.test(tgl) && !isNaN(new Date(tgl))) {
        const iso = tgl + 'T' + String(C.eventISO).split('T')[1];
        if (!isNaN(new Date(iso))) {
          reps.push([fmt(C.eventISO), fmt(iso)]);
          if (C.hashtag) C.hashtag = C.hashtag.split(String(C.eventISO).slice(0, 4)).join(tgl.slice(0, 4));   // #NadiaArya2026 → tahun baru
          C.eventISO = iso;
        }
      }
      const name = (k, v) => {
        if (!v) return;
        const old = C['name' + k], full = C['fullName' + k];
        if (full) reps.push([full, v]);                                   // nama lengkap lama → nama baru
        if (old) reps.push([old, v], [old.toLowerCase(), v.toLowerCase().replace(/[^a-z0-9]/g, '')]);
        C['name' + k] = v; C['fullName' + k] = v;
      };
      const o1 = C.name1, o2 = C.name2;
      name(1, n1); name(2, n2);
      if (!reps.length) return;
      if (n1 || n2) reps.unshift([`${o1}${o2}`, `${C.name1.split(' ')[0]}${C.name2.split(' ')[0]}`]);   // hashtag #NadiaArya2026 → kata pertama saja (hashtag panjang tidak bisa dipatah & melebarkan halaman)
      const walk = v => typeof v === 'string' ? reps.reduce((s, [a, b]) => a ? s.split(a).join(b) : s, v)
        : Array.isArray(v) ? v.map(walk) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, walk(x)])) : v;
      ['coupleNames', 'hashtag', 'banks', 'events', 'story', 'closingText', 'tagline', 'giftAddress', 'dateDisplay', 'instagram1', 'instagram2', 'shareMessage'].forEach(k => { if (C[k] != null) C[k] = walk(C[k]); });
      C.__tried = true;
    },

    /* tombol "Coba nama kalian" di halaman demo → form kecil → muat ulang dengan ?n1&n2&tgl (parameter ?to dipertahankan) */

      const b = document.createElement('div'); b.className = 'demo-try';

      b.innerHTML = `<button type="button" class="dt-open">✎ ${C.__tried ? 'Ganti nama' : 'Coba nama kalian'}</button>
        <form class="dt-form" hidden><b>Lihat dengan nama kalian</b>
          <label>Nama pria<input name="n1" maxlength="24" placeholder="mis. Budi" value="${q.get('n1') ? C.name1 : ''}"></label>
          <label>Nama wanita<input name="n2" maxlength="24" placeholder="mis. Ani" value="${q.get('n2') ? C.name2 : ''}"></label>
          <label>Tanggal acara (opsional)<input name="tgl" type="date" value="${(q.get('tgl') || '').replace(/[^0-9-]/g, '')}"></label>
          <div><button type="submit">Tampilkan</button><button type="button" class="dt-x">Tutup</button></div></form>`;
      const css = document.createElement('style');
      css.textContent = `.demo-try{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:120;font:500 13px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;color:#222}

.demo-try form{margin-top:8px;width:min(280px,calc(100vw - 20px));padding:14px;border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);display:grid;gap:9px}
.demo-try form[hidden]{display:none}.demo-try label{display:grid;gap:3px;font-size:12px;color:#555;letter-spacing:0;text-transform:none;margin:0}

      document.head.appendChild(css); document.body.appendChild(b);
      const f = b.querySelector('form');
      b.querySelector('.dt-open').onclick = () => { f.hidden = !f.hidden; if (!f.hidden) f.n1.focus(); };
      b.querySelector('.dt-x').onclick = () => { f.hidden = true; };
      f.onsubmit = e => {
        e.preventDefault();
        const p = new URLSearchParams(location.search);
        ['n1', 'n2', 'tgl'].forEach(k => { const v = f[k].value.trim(); v ? p.set(k, v) : p.delete(k); });

    },

    start(userC) {
      const C = Object.assign({}, DEFAULTS, userC);
      if (C.demo) this.tryNames(C);

      const addons = C.addons || [];

      const endpoint = C.endpoint || '';

      const d = new Date(C.eventISO), tz = C.timezone;
      const fmt = (loc, o) => new Intl.DateTimeFormat(loc, Object.assign({ timeZone: tz }, o));
      const p = {}; fmt('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).formatToParts(d).forEach(x => p[x.type] = x.value);
      const date = {
        long: fmt('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d),
        dmySpaced: `${p.day} . ${p.month} . ${p.year}`,

        time: fmt('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }).format(d).replace(':', '.') + ' ' + (ZONE[tz] || '')
      };

      /* kalender bulan acara (untuk tema yang menampilkan kalender): minggu dimulai Senin */
      const cal = (() => {

          daysInMonth: new Date(Date.UTC(y, m, 0)).getUTCDate(), offset: (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7,
          dow: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'] };
      })();

      /* ---- galeri sesuai paket ---- */
      let gal = (C.gallery || []).slice(0, P.galleryMax + (+C.galleryExtra || 0));
      if (!C.demo) gal = gal.filter(Boolean);

      /* ---- kalender ---- */
      const f = x => x.toISOString().replace(/[-:]|\.\d{3}/g, '');
      const en = new Date(d.getTime() + C.eventDurationHours * 36e5);
      const gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent('Pernikahan ' + names)
        + '&dates=' + f(d) + '/' + f(en)

        document.head.insertBefore(b, document.head.firstChild);

        }
      }

      /* QR check-in (premium) */
      const qrBox = $('[data-qr]');
      if (qrBox && has('qr') && hasGuest) {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
        s.onload = () => { const q = qrcode(0, 'M'); q.addData(`U1|${slug}|${guest}`); q.make(); qrBox.innerHTML = q.createSvgTag({ scalable: true, margin: 2 }); };
        document.head.appendChild(s);
      }

      /* animasi masuk & keluar saat scroll, DUA ARAH:
         scroll turun → elemen naik dari bawah; scroll naik → elemen turun dari atas.
         Dimulai setelah cover dibuka. Menghormati pengaturan "reduce motion". */
      let revealStarted = false;
      function startReveal() {
        if (revealStarted) return; revealStarted = true;
        const items = $$('.rv');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { items.forEach(el => el.classList.add('in')); return; }
        const io = new IntersectionObserver(es => es.forEach(x => {
          const el = x.target;
          if (x.isIntersecting) { el.classList.remove('above'); el.classList.add('in'); }
          else { el.classList.remove('in'); el.classList.toggle('above', x.boundingClientRect.top < innerHeight / 2); }
        }), { threshold: 0.05, rootMargin: '-8% 0px -8% 0px' });
        items.forEach(el => io.observe(el));
      }
      if (!cover) startReveal();
    }
  };
  window.Undangan = Undangan;
})();

</script>
<script>
/* TEMA PLATFORM ("Wedding Run") — undangan game platformer yang benar-benar dimainkan:
   tombol ◀ ▶ (tahan) untuk jalan, ⤒ untuk lompat, AUTO untuk berjalan sendiri. Semua info menyatu di LANGIT dunia game:
   awan judul, spanduk pesawat kertas, balon udara mempelai, awan papan skor, pulau melayang acara, awan kisah, layang-layang info,
   tali jemuran foto antara dua balon (galeri), kapal udara video, pulau peti harta (amplop), kantor pos awan (RSVP), pelangi penutup.
   Benda yang isinya panjang (video, amplop, RSVP, QR) dibuka dengan tombol BUKA saat didekati → gulungan perkamen.
   Dunia & karakter orisinal (blok hati, hati koleksi). Sprite kustom: illustrationURL. */
Undangan.register('platform', {
  base: true,
  render(C, H) {
    const { esc, has, date, cal, blocks: B } = H;
    H.setVar('--u-ink', '#2b1d4a'); H.setVar('--u-bg', '#fff8e7');
    const names = H.names;

    /* ---------- sprite 12 x 20 + frame kaki berlari ---------- */
    const PAL = { H: '#5b3a22', h: '#8a5a33', S: '#f3c9a0', E: '#2a1a10', B: '#f08a7c', T: '#4f9a8f', t: '#3b7a72', P: '#8a6a3a', K: '#2f2118', O: '#e39a3a', o: '#a8661c', W: '#fff' };
    const GROOM = ['...HHHHHH...', '..HHHHHHHH..', '..HHSSSSHH..', '..HSSSSSSH..', '..HSESSESH..', '..SSBSSBSS..', '...SSSSSS...', '....SSSS....', '..TTTTTTTT..', '.TTTTTTTTTT.', '.STTTTTTTTS.', '.STtTTTTtTS.', '.SSTTTTTTSS.', '..TTTTTTTT..', '..PPPPPPPP..', '..PPP..PPP..', '..PPP..PPP..', '..PPP..PPP..', '..KKK..KKK..', '.KKKK..KKKK.'];
    const BRIDE = ['...OOOOOO...', '.OOOOOOOOOO.', 'OOOOOOOOOOOO', '..oHHHHHHo..', '..HHSSSSHH..', '..HSESSESH..', '..SSBSSBSS..', '...SSSSSS...', '...HSSSSH...', '..TTTTTTTT..', '.TTTTTTTTTT.', '.STTTTTTTTS.', '.SSTTTTTTSS.', '..TTTTTTTT..', '.TTTTTTTTTT.', '.TTTTTTTTTT.', '..SS....SS..', '..SS....SS..', '..KK....KK..', '.KKK....KKK.'];
    const legs = (rows, tail) => rows.slice(0, 20 - tail.length).concat(tail);
    const G2 = legs(GROOM, ['..PPP.PPP...', '.PPP...PPP..', '.KKK....KKK.', 'KKK.......KK']);
    const B2 = legs(BRIDE, ['...SS..SS...', '..SS....SS..', '.KK......KK.', 'KK........KK']);
    const svg = (rows, cls) => { let r = ''; rows.forEach((line, y) => [...line].forEach((c, x) => { if (c !== '.') r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`; })); return `<svg class="${cls}" viewBox="0 0 12 20" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`; };
    const hero = C.illustrationURL ? `<img class="cimg" src="${esc(C.illustrationURL)}" alt="${esc(names)}">`
      : `<span class="ch b">${svg(BRIDE, 'fa')}${svg(B2, 'fb')}</span><span class="ch g">${svg(GROOM, 'fa')}${svg(G2, 'fb')}</span>`;

    /* ---------- dunia: potongan berurutan dari kiri ke kanan ---------- */
    let X = 0; const W = [], SKY = [], ST = [], MD = [];
    const piece = (w, ground, sky, st) => { if (ground) W.push(ground.replace(/@x/g, X)); if (sky) SKY.push(sky.replace(/@x/g, X)); if (st) ST.push(Object.assign({ x0: X, x1: X + w }, st)); X += w; };
    const sk = (cls, x, inner, extra = '') => `<div class="sk ${cls}" data-x="${x}" style="left:${x}px;${extra}">${inner}</div>`;
    const cloud = (inner, cls = '') => `<div class="cld ${cls}">${inner}</div>`;
    const btn = (label, href) => `<a class="btn sm" href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;
    const modal = (id, title, body) => { MD.push(`<div class="mdl" id="m-${id}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="scroll"><button class="mx" aria-label="Tutup">✕</button><h2>${esc(title)}</h2><div class="mb">${body}</div></div></div>`); };
    /* jeda darat: bata, blok hati, hati koleksi, semak/bunga */
    let gapN = 0;
    const gap = () => { const i = gapN++, b = i % 3; piece(240,
      `<i class="brk" style="left:@xpx;margin-left:20px;width:${b ? 96 : 72}px" data-solid></i>
       <i class="blk" style="left:@xpx;margin-left:${b ? 150 : 130}px" data-solid data-blk><b>♥</b></i>
       ${[0, 1, 2].map(j => `<i class="hc" style="left:@xpx;margin-left:${34 + j * 26}px;bottom:${132 + (j === 1 ? 12 : 0)}px" data-hc>♥</i>`).join('')}
       <i class="bush" style="left:@xpx;margin-left:${b === 1 ? 200 : 10}px"></i><i class="flw" style="left:@xpx;margin-left:${120 + b * 20}px"></i>`); };

    /* 1. START: gerbang + awan judul */
    piece(560, `<div class="ob gate" style="left:@xpx;margin-left:-6px"><b>START</b></div><div class="ob sign" style="left:@xpx;margin-left:330px"><b>JALAN ▶</b></div>`,
      sk('big', X + 70, cloud(`<p class="lv">${esc(C.coverText || 'Undangan Pernikahan')}</p><h1 class="nmz">${esc(C.name1)}<i>♥</i>${esc(C.name2)}</h1><p class="dt">${esc(date.dmyDots)}</p>`, 'title')));
    gap();
    /* 2. spanduk pesawat kertas (tagline) & awan ayat */
    if (C.tagline) { piece(440, '', sk('plane', X + 10, `<span class="pl">✈</span><div class="ban"><p>${esc(C.tagline)}</p></div>`)); }
    if (has('quote') && C.quote && C.quote.text) { piece(420, '', sk('', X + 40, cloud(`<p class="qt">“${esc(C.quote.text)}”</p><p class="sr">${esc(C.quote.source)}</p>`))); gap(); }
    /* 3. mempelai di dua balon udara */
    if (has('couple')) {
      const bal = (full, par, ig, ph, c) => `<div class="bal ${c}"><div class="env">${ph ? `<img src="${esc(ph)}" alt="${esc(full)}" loading="lazy">` : ''}</div><i class="rope"></i><div class="bsk"><h3>${esc(full)}</h3><p>${esc(par)}</p>${ig ? `<a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a>` : ''}</div></div>`;
      piece(600, '', sk('pair', X + 20, `${bal(C.fullName1, C.parents1, C.instagram1, C.photo1, 'p1')}<i class="hrt">♥</i>${bal(C.fullName2, C.parents2, C.instagram2, C.photo2, 'p2')}`));
      gap();
    }
    /* 4. awan papan skor: hitung mundur */
    piece(440, '', sk('', X + 30, cloud(`<p class="lv">MENUJU HARI H</p><p class="kv">${esc(date.long)}</p>
      <div class="count"><div><b data-cd="d">0</b><span>HARI</span></div><div><b data-cd="h">0</b><span>JAM</span></div><div><b data-cd="m">0</b><span>MNT</span></div><div><b data-cd="s">0</b><span>DTK</span></div></div>
      ${btn('+ Kalender', H.gcal)}`, 'score')));
    const calHtml = B.calendar(); if (calHtml) piece(360, '', sk('lo', X + 20, cloud(calHtml, 'calc')));
    gap();
    /* 5. acara di pulau melayang */
    if (has('events')) (C.events || []).forEach((e, i, a) => {
      piece(420, '', sk('isl', X + 30, `<div class="bb"><p class="lv">${esc(e.title)}</p>${e.dateText ? `<p>${esc(e.dateText)}</p>` : ''}<p class="tm">${esc(e.timeText)}</p><p><b>${esc(e.venue)}</b><br>${esc(e.address)}</p>
        ${e.mapsURL ? btn('📍 Peta', e.mapsURL) : ''}${i === a.length - 1 && has('livestream') && C.livestreamURL ? btn('▶ Live', C.livestreamURL) : ''}</div><div class="land"></div>`, `--bob:${i % 2 ? -1 : 1}`));
    });
    const prog = B.program(); if (prog) piece(400, '', sk('', X + 30, cloud(`<p class="lv">JADWAL</p>${prog}`)));
    gap();
    /* 6. kisah kami: deretan awan */
    if (has('story') && (C.story || []).length) {
      C.story.forEach((s, i) => piece(320, `<div class="ob post" style="left:@xpx;margin-left:120px"><b>${esc(s.date)}</b></div>`,
        sk(i % 2 ? 'hi' : '', X + 20, cloud(`<p class="yr">★ ${esc(s.date)}</p><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>`, 'story'))));
      gap();
    }
    /* 7. info penting di layang-layang */
    const info = B.dresscode() + B.details();
    if (info) { piece(420, '', sk('kite', X + 40, `<i class="kt"></i><i class="str"></i><div class="kp"><p class="lv">INFO PENTING</p>${info}</div>`)); gap(); }
    /* 8. galeri: tali jemuran foto antara dua balon */
    if (has('gallery') && H.gal.length) {
      const n = H.gal.length;
      piece(n * 96 + 220, '', sk('line', X + 20, `<i class="lb l"></i><i class="lb r"></i><p class="lv tag">GALERI ♥</p><div class="str2"></div><div class="pols">${H.gal.map((g, i) => `<div class="pol g" data-src="${esc(g)}" style="--r:${(i % 3 - 1) * 4}deg">${H.img(g, 'Galeri')}</div>`).join('')}</div>`, `width:${n * 96 + 160}px`));
      gap();
    }
    /* 9. kapal udara video */
    const vid = B.video();
    if (vid) { modal('video', 'Video', vid); piece(400, '', sk('blimp', X + 30, `<div class="zep" data-mdl="video"><b>▶ TONTON</b></div>`), { mdl: 'video', label: 'TONTON' }); }
    /* 10. pulau peti harta (amplop) */
    const gift = B.gift();
    if (gift) { modal('gift', 'Tanda Kasih', gift); piece(400, '', sk('isl', X + 30, `<div class="bb"><p class="lv">TANDA KASIH</p><p>Buka peti harta ini</p></div><i class="chest" data-mdl="gift"></i><div class="land"></div>`), { mdl: 'gift', label: 'BUKA' }); }
    /* 11. kantor pos awan (RSVP) */
    const rsvp = B.rsvp();
    if (rsvp) { modal('rsvp', 'Konfirmasi Kehadiran', rsvp); piece(440, '', sk('isl post-o', X + 30, `<i class="pp1">✉</i><i class="pp2">✉</i><div class="house" data-mdl="rsvp"><b>POS</b><i class="door"></i></div><div class="land"></div>`), { mdl: 'rsvp', label: 'RSVP' }); }
    /* 12. tiket QR di layang-layang */
    const qr = B.qr();
    if (qr) { modal('qr', 'QR Tamu', qr); piece(320, '', sk('kite tix', X + 40, `<i class="kt"></i><i class="str"></i><div class="kp" data-mdl="qr"><p class="lv">🎟 QR TAMU</p><p>Tunjukkan saat tiba</p></div>`), { mdl: 'qr', label: 'QR' }); }
    gap();
    /* 13. FINISH: pelangi + gerbang + awan penutup */
    const FIN = X;
    piece(820, `<div class="ob gate fin-g" style="left:@xpx;margin-left:250px"><b>JUST MARRIED</b></div><div class="ob flag" style="left:@xpx;margin-left:640px"><b>♥</b></div>`,
      `<i class="rainbow" style="left:${X + 120}px"></i>` + sk('big', X + 60, cloud(`<p class="big">${esc(C.thanksTitle || 'TERIMA KASIH')}</p><p class="qt">${esc(C.closingText)}</p><p class="nmz sm">${esc(names)}</p>${C.hashtag ? `<p class="sr">${esc(C.hashtag)}</p>` : ''}`, 'title')));
    const WW = X;

    const mini = ST.filter(s => s.mdl).map(s => `<i style="left:${(s.x0 / WW * 100).toFixed(2)}%"></i>`).join('');
    return `<section class="cover" data-cover><div class="sky"><i class="sun"></i><i class="cl c1"></i><i class="cl c2"></i><i class="cl c3"></i></div><div class="hills"></div>
      <div class="ttl"><p class="lv">— WEDDING RUN —</p><h1 class="nmz">${esc(C.name1)}<i>♥</i>${esc(C.name2)}</h1><p class="dt">${esc(date.dmyDots)}</p>
        <p class="to">PEMAIN 1</p><p class="gn" data-guest></p><button class="btn blink" data-open>▶ ${esc(C.openButton || 'Mulai')}</button><p class="hint">tahan ▶ untuk berjalan · ⤒ untuk lompat</p></div>
      <div class="cgate"><div class="ob gate"><b>JUST MARRIED</b></div><div class="duo">${hero}</div></div><div class="grd"></div></section>
    <div class="game" data-ww="${WW}" data-fin="${FIN}" data-st='${JSON.stringify(ST.map(s => [s.x0, s.x1, s.mdl, s.label]))}'>
      <div class="sky"><i class="sun"></i></div><div class="mtn"></div><div class="hills"></div>
      <div class="world" style="width:${WW}px">${SKY.join('')}${W.join('')}<div class="grd"></div></div>
      <div class="duo">${hero}<p class="say">Tahan ▶ untuk jalan!</p></div>
      <div class="fw"><i></i><i></i><i></i><i></i></div>
      <div class="hud"><span>PEMAIN<b data-guest></b></span><span class="hm">♥ x <b class="hcnt">00</b></span><span>H-<b data-cd="d">0</b></span>
        <div class="mini">${mini}<b class="me"></b></div></div>
      <div class="pad"><div><button data-k="L" aria-label="Jalan ke kiri">◀</button><button data-k="R" aria-label="Jalan ke kanan">▶</button></div>
        <div><button class="auto" aria-label="Jalan otomatis">AUTO</button><button class="actb" hidden>BUKA</button><button data-k="J" aria-label="Lompat">⤒</button></div></div>
    </div>${MD.join('')}`;
  },

  /* Game loop: fisika sederhana (gravitasi, lompat, mendarat di bata/blok, kepala memantulkan blok hati), kamera mengikuti,
     parallax langit/gunung/bukit lewat --x, benda langit "turun" saat masuk layar (.seen), tombol BUKA muncul di dekat pos,
     kembang api di finish. Bunyi kecil hanya bila musik menyala. */
  after(root) {
    const $ = s => root.querySelector(s), $$ = s => [...root.querySelectorAll(s)];
    const game = $('.game'); if (!game) return;
    const world = $('.world'), duo = $('.game .duo'), cnt = $('.hcnt'), me = $('.mini .me'), actb = $('.actb'), say = $('.say'), autoB = $('.auto');
    const WW = +game.dataset.ww, FIN = +game.dataset.fin, ST = JSON.parse(game.dataset.st), GRD = 72, PW = 84, PH = 64;
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const lx = el => parseFloat(el.style.left) + (parseFloat(el.style.marginLeft) || 0);
    const solids = $$('[data-solid]').map(el => ({ el, x: lx(el), w: el.offsetWidth, y: parseFloat(getComputedStyle(el).bottom) - GRD, h: el.offsetHeight, blk: el.hasAttribute('data-blk') }));
    const hearts = $$('[data-hc]').map(el => ({ el, x: lx(el) + 10, y: parseFloat(el.style.bottom) - GRD + 10 }));
    const skies = $$('.sk').map(el => [el, +el.dataset.x]);

    let ac; const beep = (f1, f2, d) => {
      if (!document.querySelector('.music.on')) return;
      try { ac = ac || new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
        o.type = 'square'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d); } catch (e) { /* audio tidak tersedia */ }
    };

    /* ---------- input: tombol layar, keyboard ---------- */
    const keys = { L: 0, R: 0, J: 0 }; let auto = false, jumpQ = false, open = null, moved = false;
    const setAuto = v => { auto = v; autoB.classList.toggle('on', v); };
    $$('.pad [data-k]').forEach(b => {
      const k = b.dataset.k, on = e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); keys[k] = 1; b.classList.add('dn'); if (k === 'J') jumpQ = true; else setAuto(false); }, off = () => { keys[k] = 0; b.classList.remove('dn'); };
      b.addEventListener('pointerdown', on); ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, off)); b.addEventListener('contextmenu', e => e.preventDefault());
    });
    autoB.addEventListener('click', () => setAuto(!auto));
    const KM = { ArrowLeft: 'L', a: 'L', A: 'L', ArrowRight: 'R', d: 'R', D: 'R', ArrowUp: 'J', w: 'J', W: 'J', ' ': 'J' };
    addEventListener('keydown', e => {
      if (open) { if (e.key === 'Escape') closeM(); return; }
      if (e.target.closest && e.target.closest('input,textarea,select')) return;
      if ((e.key === 'Enter' || e.key === 'e') && !actb.hidden) { actb.click(); return; }
      const k = KM[e.key]; if (!k) return; e.preventDefault(); if (k === 'J' && !keys.J) jumpQ = true; keys[k] = 1; if (k !== 'J') setAuto(false);
    });
    addEventListener('keyup', e => { const k = KM[e.key]; if (k) keys[k] = 0; });

    /* ---------- gulungan perkamen (modal) ---------- */
    const openM = id => { const m = document.getElementById('m-' + id); if (!m) return; open = m; m.classList.add('show'); setAuto(false); Object.keys(keys).forEach(k => keys[k] = 0); beep(330, 660, .2); setTimeout(() => m.querySelector('.mx').focus(), 50); };
    const closeM = () => { if (!open) return; open.classList.remove('show'); open = null; };
    $$('.mdl').forEach(m => m.addEventListener('click', e => { if (e.target === m || e.target.closest('.mx')) closeM(); }));
    root.addEventListener('click', e => { const t = e.target.closest('[data-mdl]'); if (t && !e.target.closest('.mdl')) openM(t.dataset.mdl); });
    let near = null; actb.addEventListener('click', () => near && openM(near[2]));

    /* ---------- fisika ---------- */
    const G = 1800, V0 = 680, SP = 200;
    /* #x=1234 = mulai di posisi itu (untuk cek tampilan) */
    let px = +(location.hash.match(/^#x=(\d+)/) || [0, 70])[1], py = 0, vy = 0, onG = true, face = 1, cam = 0, got = 0, last = 0, fin = false;
    const hit = s => px < s.x + s.w && px + PW > s.x && py < s.y + s.h && py + PH > s.y;
    const step = dt => {
      const dir = open ? 0 : (keys.R || auto ? 1 : 0) - (keys.L ? 1 : 0);
      if (dir) { face = dir; if (!moved) { moved = true; say.classList.add('off'); } }
      px = Math.max(0, Math.min(WW - PW, px + dir * SP * dt));
      for (const s of solids) if (hit(s)) px = dir > 0 ? s.x - PW : s.x + s.w;
      if (jumpQ && onG && !open) { vy = V0; onG = false; beep(400, 800, .12); }
      jumpQ = false;
      const py0 = py; vy -= G * dt; py += vy * dt; onG = false;
      if (py <= 0) { py = 0; vy = 0; onG = true; }
      for (const s of solids) if (hit(s)) {
        if (vy <= 0 && py0 >= s.y + s.h - 1) { py = s.y + s.h; vy = 0; onG = true; }
        else if (vy > 0 && py0 + PH <= s.y + 1) { py = s.y - PH; vy = 0;
          if (s.blk) { s.el.classList.remove('bump'); void s.el.offsetWidth; s.el.classList.add('bump'); if (!s.used) { s.used = 1; got++; } beep(520, 1040, .18); } }
      }
      if (auto && px >= WW - PW - 1) setAuto(false);
      const cx = px + PW / 2;
      for (const h of hearts) if (!h.got && Math.abs(cx - h.x) < 40 && Math.abs(py + PH / 2 - h.y) < 46) { h.got = 1; h.el.classList.add('got'); got++; beep(990, 1480, .09); }
      if (!fin && px > FIN + 300) { fin = true; game.classList.add('fin'); }
      near = ST.find(s => s[2] && cx > s[0] - 20 && cx < s[1]) || null;
      actb.hidden = !near; if (near) actb.textContent = near[3];
    };
    const draw = () => {
      const vw = game.clientWidth;
      cam = Math.max(0, Math.min(WW - vw, px + PW / 2 - vw * .42));
      world.style.translate = `${-cam}px 0`; game.style.setProperty('--x', cam);
      duo.style.translate = `${px - cam}px ${-py}px`;
      duo.classList.toggle('left', face < 0); duo.classList.toggle('air', !onG);
      duo.classList.toggle('run', onG && !open && !!((keys.R || auto) ^ keys.L));
      cnt.textContent = String(got).padStart(2, '0'); me.style.left = (px / WW * 100) + '%';
      for (const k of skies) if (!k[2] && k[1] < cam + vw + 60) { k[2] = 1; k[0].classList.add('seen'); }
    };
    const loop = t => { const dt = Math.min(.033, (t - (last || t)) / 1000); last = t; step(dt); draw(); requestAnimationFrame(loop); };
    draw(); requestAnimationFrame(loop);
    if (still) skies.forEach(k => k[0].classList.add('seen'));
  }
});

</script>
<script>Undangan.start(CONFIG);</script>
</body>
</html>
