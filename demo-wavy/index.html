<script>
/* =====================================================================
   ENGINE UNDANGAN DIGITAL  —  logika bersama untuk semua tema
   Tema hanya bertugas menggambar HTML (render) + CSS.
   Engine mengurus: paket/fitur, nama tamu, hitung mundur, kalender,
   RSVP, ucapan, amplop digital, galeri, musik, QR, pelacakan, masa aktif.
===================================================================== */
(function () {
  /* ---------------- PAKET & FITUR ---------------- */
  const BASIC = ['quote', 'couple', 'events', 'gallery', 'rsvp'];
  const STANDAR = BASIC.concat(['details', 'story', 'gift', 'wishes', 'music', 'map', 'track']);
  const PREMIUM = STANDAR.concat(['livestream', 'video', 'qr']);
  const PACKAGES = {
    basic:   { label: 'Basic',   features: BASIC,   galleryMax: 4 },
    standar: { label: 'Standar', features: STANDAR, galleryMax: 12 },
    premium: { label: 'Premium', features: PREMIUM, galleryMax: 30 }
  };

  const DEFAULTS = {
    package: 'basic',
    guestDefault: 'Tamu Undangan',
    timezone: 'Asia/Jakarta',
    eventDurationHours: 4,
    sections: {},
    events: [], story: [], gallery: [], details: [], banks: [],
    rsvpOptions: ['Hadir', 'Tidak Hadir', 'Masih Ragu'],
    rsvpMessage: 'Halo, saya {tamu}. Konfirmasi: {status}, jumlah {jumlah} orang. Ucapan: {ucapan}',
    giftIntro: 'Doa restu Anda adalah hadiah terindah. Namun bila ingin mengirimkan tanda kasih, dapat melalui:',
    closingText: 'Merupakan kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.',
    hashtag: '',
    coverText: 'Undangan Pernikahan',
    openButton: 'Buka Undangan',
    coverHint: 'Ketuk amplop untuk membuka',
    expiredText: 'Masa aktif undangan ini telah berakhir. Terima kasih atas doa dan kehadirannya.',
    photoGrayscale: false
  };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ZONE = { 'Asia/Jakarta': 'WIB', 'Asia/Makassar': 'WITA', 'Asia/Jayapura': 'WIT' };

  const Undangan = {
    packages: PACKAGES,
    themes: {},
    register(name, theme) { this.themes[name] = theme; },

    /* Pecah teks elemen (yang cocok dengan selector) menjadi kata:
       <span class="w" style="--i:n;--r:±deg"><span class="wi">kata</span></span>
       Dipakai tema untuk animasi kata. `skip(el)` → true bila elemen dilewati. */
    splitWords(root, sel, skip) {
      root.querySelectorAll(sel).forEach(el => {
        if (el.querySelector('.w') || el.closest('.w') || (skip && skip(el))) return;
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        let i = 0;
        nodes.forEach(n => {
          if (!n.textContent.trim()) return;
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(part => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.append(' '); return; }
            const w = document.createElement('span'); w.className = 'w';
            w.style.setProperty('--i', i);
            w.style.setProperty('--r', ((i % 2 ? 1 : -1) * (1 + (i % 3) * .6)).toFixed(1) + 'deg');
            const inner = document.createElement('span'); inner.className = 'wi'; inner.textContent = part;
            w.append(inner); frag.append(w); i++;
          });
          n.replaceWith(frag);
        });
      });
    },

    /* DEMO SAJA: calon pembeli mencoba nama & tanggal sendiri lewat link ?n1=Budi&n2=Ani&tgl=2027-05-20.
       Semua teks yang memuat nama/tanggal lama diganti (nama lengkap, hashtag, rekening, tanggal acara).
       Tidak berlaku untuk undangan klien asli (C.demo kosong) → link klien tidak bisa diubah orang lain. */
    tryNames(C) {
      const q = new URLSearchParams(location.search);
      const clean = v => (v || '').replace(/[<>"&]/g, '').replace(/\s+/g, ' ').trim().slice(0, 24);
      const n1 = clean(q.get('n1')), n2 = clean(q.get('n2')), tgl = q.get('tgl') || '';
      const reps = [];
      const fmt = iso => new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: C.timezone }).format(new Date(iso));
      if (/^\d{4}-\d{2}-\d{2}$/.test(tgl) && !isNaN(new Date(tgl))) {
        const iso = tgl + 'T' + String(C.eventISO).split('T')[1];
        if (!isNaN(new Date(iso))) {
          reps.push([fmt(C.eventISO), fmt(iso)]);
          if (C.hashtag) C.hashtag = C.hashtag.split(String(C.eventISO).slice(0, 4)).join(tgl.slice(0, 4));   // #NadiaArya2026 → tahun baru
          C.eventISO = iso;
        }
      }
      const name = (k, v) => {
        if (!v) return;
        const old = C['name' + k], full = C['fullName' + k];
        if (full) reps.push([full, v]);                                   // nama lengkap lama → nama baru
        if (old) reps.push([old, v], [old.toLowerCase(), v.toLowerCase().replace(/[^a-z0-9]/g, '')]);
        C['name' + k] = v; C['fullName' + k] = v;
      };
      const o1 = C.name1, o2 = C.name2;
      name(1, n1); name(2, n2);
      if (!reps.length) return;
      if (n1 || n2) reps.unshift([`${o1}${o2}`, `${C.name1.split(' ')[0]}${C.name2.split(' ')[0]}`]);   // hashtag #NadiaArya2026 → kata pertama saja (hashtag panjang tidak bisa dipatah & melebarkan halaman)
      const walk = v => typeof v === 'string' ? reps.reduce((s, [a, b]) => a ? s.split(a).join(b) : s, v)
        : Array.isArray(v) ? v.map(walk) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, walk(x)])) : v;
      ['coupleNames', 'hashtag', 'banks', 'events', 'story', 'closingText', 'tagline', 'giftAddress', 'dateDisplay', 'instagram1', 'instagram2', 'shareMessage'].forEach(k => { if (C[k] != null) C[k] = walk(C[k]); });
      C.__tried = true;
    },

    /* tombol "Coba nama kalian" di halaman demo → form kecil → muat ulang dengan ?n1&n2&tgl (parameter ?to dipertahankan) */
    demoPill(C) {
      const b = document.createElement('div'); b.className = 'demo-try';
      const q = new URLSearchParams(location.search);
      b.innerHTML = `<button type="button" class="dt-open">✎ ${C.__tried ? 'Ganti nama' : 'Coba nama kalian'}</button>
        <form class="dt-form" hidden><b>Lihat dengan nama kalian</b>
          <label>Nama pria<input name="n1" maxlength="24" placeholder="mis. Budi" value="${q.get('n1') ? C.name1 : ''}"></label>
          <label>Nama wanita<input name="n2" maxlength="24" placeholder="mis. Ani" value="${q.get('n2') ? C.name2 : ''}"></label>
          <label>Tanggal acara (opsional)<input name="tgl" type="date" value="${(q.get('tgl') || '').replace(/[^0-9-]/g, '')}"></label>
          <div><button type="submit">Tampilkan</button><button type="button" class="dt-x">Tutup</button></div></form>`;
      const css = document.createElement('style');
      css.textContent = `.demo-try{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:120;font:500 13px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;color:#222}

      const coords = e => {

      const mk = (cls, label, txt, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'lb-b ' + cls; b.setAttribute('aria-label', label); b.textContent = txt; b.onclick = e => { e.stopPropagation(); fn(); }; lb.appendChild(b); return b; };
      const counter = document.createElement('div'); counter.className = 'lb-c'; lb.appendChild(counter);
      const show = i => {
        cur = (i + pics.length) % pics.length;
        lbImg.src = pics[cur].dataset.src; lbImg.alt = (pics[cur].querySelector('img') || {}).alt || 'Foto galeri';
        lbImg.style.filter = C.photoGrayscale ? 'grayscale(1)' : 'none';
        counter.textContent = pics.length > 1 ? `${cur + 1} / ${pics.length}` : '';
        if (!lb.classList.contains('show')) { lastFocus = document.activeElement; lb.classList.add('show'); }
        xBtn.focus();
      };
      const hide = () => { if (!lb.classList.contains('show')) return; lb.classList.remove('show'); if (lastFocus && lastFocus.focus) lastFocus.focus(); };
      const prevBtn = mk('lb-p', 'Foto sebelumnya', '‹', () => show(cur - 1));
      const nextBtn = mk('lb-n', 'Foto berikutnya', '›', () => show(cur + 1));
      const xBtn = mk('lb-x', 'Tutup', '✕', hide);
      if (pics.length < 2) { prevBtn.style.display = nextBtn.style.display = 'none'; }
      pics.forEach((g, i) => {
        g.tabIndex = 0; g.setAttribute('role', 'button'); g.setAttribute('aria-label', 'Perbesar foto ' + (i + 1));
        g.addEventListener('click', () => show(i));
        g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(i); } });
      });
      lb.onclick = hide;
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('show')) return;
        if (e.key === 'Escape') hide();
        else if (e.key === 'ArrowLeft') show(cur - 1);
        else if (e.key === 'ArrowRight') show(cur + 1);
      });
      let sx = 0;
      lb.addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50 && pics.length > 1) show(cur + (dx < 0 ? 1 : -1)); }, { passive: true });

      /* RSVP + ucapan */
      const form = $('[data-rsvp]');
      if (form) {
        const val = n => ((form.elements[n] && form.elements[n].value) || '').trim();
        const wa = () => {
          if (!C.rsvpPhone) return toast('Nomor WhatsApp belum diatur');
          const v = { tamu: val('fn') || guest, status: val('st'), jumlah: val('fj'), ucapan: val('fm') || '-' };
          const m = C.rsvpMessage.replace(/\{(tamu|status|jumlah|ucapan)\}/g, (_, k) => v[k]);   // fungsi, bukan string: ucapan berisi $& tidak merusak pesan
          window.open(`https://wa.me/${C.rsvpPhone}?text=${encodeURIComponent(m)}`, '_blank');
        };
        $$('[data-act=wa]', form).forEach(b => b.addEventListener('click', wa));

        if (has('wishes')) {
          const KEY = 'wishes:' + slug;
          const local = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
          let remote = [];
          const box = $('[data-wishes]');
          const render = () => {
            if (!box) return;
            const list = (endpoint ? remote : local()).slice().sort((a, b) => (b.time || 0) - (a.time || 0));
            box.innerHTML = '';
            if (!list.length) { box.innerHTML = '<p style="text-align:center">Jadilah yang pertama memberi ucapan ♥</p>'; return; }
            list.forEach(w => {
              const row = document.createElement('div'); row.className = 'wish';
              const b = document.createElement('b'); b.textContent = w.name;
              const t = document.createElement('span'); t.className = 'tag'; t.textContent = w.status;
              const m = document.createElement('p'); m.textContent = w.message;
              row.append(b, t, m); box.appendChild(row);
            });
          };
          if (endpoint) fetch(`${endpoint}?type=wishes&slug=${encodeURIComponent(slug)}`).then(r => r.json()).then(j => { remote = Array.isArray(j) ? j : []; render(); }).catch(() => {});
          render();
          /* anti-bot: kolom jebakan tak terlihat (manusia tak mengisinya) + jeda antar kiriman */
          const trap = document.createElement('input');
          trap.type = 'text'; trap.name = 'website'; trap.tabIndex = -1; trap.autocomplete = 'off'; trap.setAttribute('aria-hidden', 'true');
          trap.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;opacity:0';
          form.appendChild(trap);
          let lastSend = 0;
          /* ID acak per perangkat: kirim ulang dari perangkat yang sama MEMPERBARUI konfirmasi lama (tidak dobel) */
          const rid = (() => { try { let r = localStorage.getItem('rid:' + slug); if (!r) { r = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('rid:' + slug, r); } return r; } catch { return Math.random().toString(36).slice(2); } })();
          form.addEventListener('submit', e => {
            e.preventDefault();
            const w = { name: val('fn'), status: val('st'), jumlah: val('fj'), message: val('fm'), time: Date.now() };
            if (!w.name) return;
            if (trap.value) return;                                   // bot
            if (Date.now() - lastSend < 15000) return toast('Sebentar ya, baru saja terkirim');
            lastSend = Date.now();
            if (endpoint) { post(Object.assign({ type: 'rsvp', rid }, w)); if (w.message) remote = [Object.assign({ mine: true }, w)].concat(remote.filter(x => !x.mine)); }
            else try { localStorage.setItem(KEY, JSON.stringify([w].concat(local()))); } catch {}
            render(); const m = form.elements['fm']; if (m) m.value = ''; toast('Terkirim, terima kasih ♥');
          });
        } else {
          form.addEventListener('submit', e => { e.preventDefault(); wa(); });
        }
      }

      /* QR check-in (premium) */
      const qrBox = $('[data-qr]');
      if (qrBox && has('qr') && hasGuest) {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
        s.onload = () => { const q = qrcode(0, 'M'); q.addData(`U1|${slug}|${guest}`); q.make(); qrBox.innerHTML = q.createSvgTag({ scalable: true, margin: 2 }); };
        document.head.appendChild(s);
      }

      /* animasi masuk & keluar saat scroll, DUA ARAH:
         scroll turun → elemen naik dari bawah; scroll naik → elemen turun dari atas.
         Dimulai setelah cover dibuka. Menghormati pengaturan "reduce motion". */
      let revealStarted = false;
      function startReveal() {
        if (revealStarted) return; revealStarted = true;
        const items = $$('.rv');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { items.forEach(el => el.classList.add('in')); return; }
        const io = new IntersectionObserver(es => es.forEach(x => {
          const el = x.target;
          if (x.isIntersecting) { el.classList.remove('above'); el.classList.add('in'); }
          else { el.classList.remove('in'); el.classList.toggle('above', x.boundingClientRect.top < innerHeight / 2); }
        }), { threshold: 0.05, rootMargin: '-8% 0px -8% 0px' });
        items.forEach(el => io.observe(el));
      }
      if (!cover) startReveal();
    }
  };
  window.Undangan = Undangan;
})();

</script>
<script>
/* TEMA WAVY — bingkai gelombang bergaya gambar tangan, tinta hitam di kertas krem, huruf kuas (referensi: "Save the Date" bingkai bergelombang) */
Undangan.register('wavy', {
  render(C, H) {
    const { esc, has, date } = H;
    H.setVar('--paper', C.colorBg); H.setVar('--ink', C.colorInk);
    const names = H.names;

    /* bingkai bergelombang: satu path (koordinat 0–100, diregangkan mengikuti kartu; garis tetap tebal sama) */
    const wob = (d) => {          // d = pergeseran fase: versi B sedikit berbeda dari A → bergantian terlihat "digambar ulang"
      const P = [], N = 44, X0 = 2.6, X1 = 97.4, Y0 = 1.6, Y1 = 98.4;
      const w = (t, k, ph) => Math.sin(t * Math.PI * 2 * k + ph + d);
      for (let i = 0; i <= N; i++) { const t = i / N; P.push([X0 + (X1 - X0) * t, Y0 + .85 * w(t, 4, 0)]); }
      for (let i = 1; i <= N; i++) { const t = i / N; P.push([X1 + 1.5 * w(t, 7, 1.3), Y0 + (Y1 - Y0) * t]); }
      for (let i = 1; i <= N; i++) { const t = i / N; P.push([X1 - (X1 - X0) * t, Y1 + .85 * w(t, 4, 2.1)]); }
      for (let i = 1; i < N; i++) { const t = i / N; P.push([X0 + 1.5 * w(t, 7, .4), Y1 - (Y1 - Y0) * t]); }
      return 'M' + P.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L') + 'Z';
    };
    const defs = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="wfp" d="${wob(0)}"/><path id="wfq" d="${wob(.9)}"/>
      <symbol id="spk" viewBox="0 0 24 24"><path d="M12 2V22M2 12H22" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"/></symbol></defs></svg>`;
    const frame = `<svg class="wf" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use class="a" href="#wfp"/><use class="b" href="#wfq"/></svg>`;
    const bow = `<svg class="bow" viewBox="0 0 120 50" aria-hidden="true" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M60 26C44 8 18 4 14 18 12 32 40 34 60 26 80 34 108 32 106 18 102 4 76 8 60 26Z" fill="#f7f4ea"/><path d="M56 26C58 22 62 22 64 26 62 30 58 30 56 26Z" fill="#111"/><path d="M54 32L46 48M66 32L74 48"/></svg>`;
    const sp = (s) => `<svg class="sk" style="${s}" viewBox="0 0 24 24" aria-hidden="true"><use href="#spk"/></svg>`;
    const heart = '<svg class="ht" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 20C4 14 2 9 3 6 4 2 9 2 12 6 15 2 20 2 21 6 22 9 20 14 12 20Z" fill="#111"/></svg>';

    /* pasangan kartun hitam-putih (atau gambar sendiri via illustrationURL) */
    const face = (src, id, cx, cy, r) => src ? `<clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><image href="${esc(src)}" x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" clip-path="url(#${id})" preserveAspectRatio="xMidYMid slice" style="filter:grayscale(1) contrast(1.1)"/>` : '';
    const f1 = C.face1 || '', f2 = C.face2 || '';
    const couple = C.illustrationURL ? `<img class="art" src="${esc(C.illustrationURL)}" alt="${esc(names)}">` : `
      <svg class="art" viewBox="0 0 300 220" role="img" aria-label="Ilustrasi mempelai" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M70 120C52 130 38 170 40 214H152C154 170 146 134 128 122Z" fill="#fbfaf4"/><path d="M96 126C100 134 106 138 112 132"/>
        <path d="M50 92C40 120 52 150 44 176 62 160 76 150 78 128 70 100 60 80 66 62 56 70 52 80 50 92Z" fill="#111"/><path d="M148 90C158 120 146 150 154 176 136 160 122 150 120 128 128 100 138 80 132 62 142 70 146 80 148 92Z" fill="#111"/>
        <circle cx="99" cy="84" r="38" fill="#fbfaf4"/>
        <path d="M62 80C62 48 92 40 112 46 132 52 140 70 136 86 128 72 116 66 100 66 84 66 70 70 62 80Z" fill="#111"/>
        ${f1 ? '' : `<circle cx="86" cy="88" r="2.6" fill="#111"/><circle cx="112" cy="88" r="2.6" fill="#111"/><path d="M90 100C96 106 106 106 110 100"/><path d="M74 96h8M116 96h8" stroke-width="1.8"/>`}
        ${face(f1, 'fc1', 99, 84, 34)}
        <path d="M70 60C60 36 80 26 94 34M104 30C122 24 138 36 126 50" fill="none"/><path d="M82 28 70 24 74 36Z M88 30L100 22 100 34Z" fill="#fbfaf4"/>
        <path d="M62 110C44 140 40 186 38 214M136 112C152 140 156 186 160 214" opacity="0"/>
        <path d="M190 128C176 138 168 176 170 214H288C290 176 282 140 264 128Z" fill="#111"/><path d="M214 128L228 154 242 128" fill="#fbfaf4"/><path d="M222 140H234L228 150Z" fill="#111" stroke="#fbfaf4" stroke-width="1.4"/>
        <circle cx="228" cy="92" r="36" fill="#fbfaf4"/>
        <path d="M194 90C190 54 224 44 246 52 266 60 268 84 262 96 258 76 246 66 228 66 212 66 198 74 194 90Z" fill="#fbfaf4"/><path d="M200 78C208 62 226 58 240 62 252 66 258 74 260 88 252 74 240 70 226 70 214 70 204 74 200 78Z" fill="#111"/>
        ${f2 ? '' : `<circle cx="216" cy="94" r="2.6" fill="#111"/><circle cx="242" cy="94" r="2.6" fill="#111"/><path d="M220 106C226 112 236 112 240 106"/><path d="M204 102h8M246 102h8" stroke-width="1.8"/>`}
        ${face(f2, 'fc2', 228, 92, 32)}
        <path d="M196 120C194 124 198 128 204 126"/>
      </svg>`;

    /* ---------- cover ---------- */
    let h = defs + `
    <section class="cover" data-cover><div class="pg">${frame}${bow}
      <h1 class="ttl">${esc(C.coverTitle || 'Save the Date')}</h1>
      ${couple}
      <p class="nm">${esc(C.name1)} &amp; ${esc(C.name2)}</p><p class="dt">${esc(date.dmyDots)}</p>
      <p class="to">Kepada Yth.</p><p class="gn" data-guest></p>
      <button class="btn" data-open>${esc(C.openButton)}</button></div></section>
    <main class="wrap">`;

    /* ---------- halaman utama ---------- */
    h += `<section class="pg rv">${frame}${bow}${sp('left:22px;top:38px')}${sp('right:24px;top:70px;width:16px')}
      <h1 class="ttl">${esc(C.coverTitle || 'Save the Date')}</h1>${couple}
      <p class="nm">${esc(C.name1)} &amp; ${esc(C.name2)}</p><p class="dt">${esc(C.dateDisplay || date.long)}</p>
      <p class="sm">${esc(C.tagline || '')}</p>
      <div class="count"><div><b data-cd="d">0</b><span>hari</span></div><div><b data-cd="h">0</b><span>jam</span></div><div><b data-cd="m">0</b><span>menit</span></div><div><b data-cd="s">0</b><span>detik</span></div></div>
      <a class="btn ghost sm2" href="${H.gcal}" target="_blank" rel="noopener">+ Simpan ke Kalender</a></section>`;

    if (has('quote') && C.quote && C.quote.text) h += `<section class="pg rv">${frame}<p class="sm q">“${esc(C.quote.text)}”</p><p class="sm"><b>${esc(C.quote.source)}</b></p></section>`;

    if (has('couple')) {
      const person = (full, par, ig, ph) => `<div class="pp">${ph ? `<div class="pic"><img src="${esc(ph)}" alt="${esc(full)}" loading="lazy"></div>` : ''}<h3>${esc(full)}</h3><p class="sm">${esc(par)}</p>${ig ? `<p class="sm"><a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a></p>` : ''}</div>`;
      h += `<section class="pg rv">${frame}<h2>Mempelai</h2>${person(C.fullName1, C.parents1, C.instagram1, C.photo1)}<div class="amp">${heart}</div>${person(C.fullName2, C.parents2, C.instagram2, C.photo2)}</section>`;
    }

    if (has('events')) {
      h += `<section class="pg rv">${frame}<h2>Acara</h2>` + C.events.map((e, i) => `${i ? '<div class="sq"></div>' : ''}
        <div class="ev"><h3>${esc(e.title)}</h3><p class="dt2">${esc(e.dateText || date.long)} · ${esc(e.timeText)}</p><p class="sm"><b>${esc(e.venue)}</b><br>${esc(e.address)}</p>
        ${H.mapBox(e)}${e.mapsURL ? `<a class="btn ghost sm2" href="${esc(e.mapsURL)}" target="_blank" rel="noopener">Lihat Lokasi</a>` : ''}</div>`).join('') +
        (has('livestream') && C.livestreamURL ? `<div class="sq"></div><a class="btn sm2" href="${esc(C.livestreamURL)}" target="_blank" rel="noopener">▶ Live Streaming</a>` : '') + `</section>`;
    }

    if (has('story') && C.story.length) h += `<section class="pg rv">${frame}<h2>Kisah Kami</h2><div class="st">` + C.story.map(s => `<div><h3>${esc(s.date)}</h3><p class="sm"><b>${esc(s.title)}</b><br>${esc(s.text)}</p></div>`).join('') + `</div></section>`;

    if (has('details') && C.details.length) h += `<section class="pg rv">${frame}<h2>Info Penting</h2>` + C.details.map(x => `<div class="det"><h3>${esc(x.h)}</h3><p class="sm">${esc(x.t)}</p></div>`).join('') + `</section>`;

    if (has('gallery') && H.gal.length) h += `<section class="pg rv">${frame}<h2>Galeri</h2><div class="gal">` + H.gal.map(g => `<div class="g" data-src="${esc(g)}">${H.img(g, 'Galeri')}</div>`).join('') + `</div></section>`;

    if (has('video') && H.ytEmbed(C.videoURL)) h += `<section class="pg rv">${frame}<h2>Video</h2><div class="vid"><iframe src="${H.ytEmbed(C.videoURL)}" allowfullscreen loading="lazy" title="Video"></iframe></div></section>`;

    if (has('gift') && (C.banks.length || C.giftAddress)) h += `<section class="pg rv">${frame}<h2>Tanda Kasih</h2><p class="sm">${esc(C.giftIntro)}</p>` +
      C.banks.map(b => `<div class="bank"><span class="sm">${esc(b.bank)}</span><strong>${esc(b.number)}</strong><span class="sm">a.n. ${esc(b.name)}</span><button class="btn ghost sm2" data-copy="${esc(b.number)}">Salin Nomor</button></div>`).join('') +
      (C.giftAddress ? `<div class="bank"><strong>Kirim Kado</strong><span class="sm">${esc(C.giftAddress)}</span><button class="btn ghost sm2" data-copy="${esc(C.giftAddress)}">Salin Alamat</button></div>` : '') + `</section>`;

    if (has('rsvp')) {
      const w = has('wishes');
      h += `<section class="pg rv">${frame}<h2>RSVP</h2>${C.rsvpNote ? `<p class="sm">${esc(C.rsvpNote)}</p>` : ''}<form data-rsvp>
        <label>Nama</label><input name="fn" required value="${H.hasGuest ? esc(H.guest) : ''}">
        <label>Kehadiran</label><select name="st">${C.rsvpOptions.map(o => `<option>${esc(o)}</option>`).join('')}</select>
        <label>Jumlah tamu</label><select name="fj">${[1, 2, 3, 4, 5].map(n => `<option>${n}</option>`).join('')}</select>
        <label>Ucapan &amp; doa</label><textarea name="fm" rows="3"></textarea>
        <div class="row">${w ? `<button class="btn" type="submit">Kirim</button>` : ''}${C.rsvpPhone ? `<button class="btn ${w ? 'ghost' : ''}" type="${w ? 'button' : 'submit'}" data-act="wa">Kirim via WhatsApp</button>` : ''}</div>
      </form>${w ? `<div class="wishes" data-wishes></div>` : ''}</section>`;
    }

    if (has('qr') && H.hasGuest) h += `<section class="pg rv">${frame}<h2>QR Tamu</h2><p class="sm">Tunjukkan QR ini saat tiba.</p><div class="qr" data-qr></div><p class="sm"><b>${esc(H.guest)}</b></p></section>`;

    h += `<section class="pg rv">${frame}${bow}<p class="sm">${esc(C.closingText)}</p><p class="nm big">${esc(C.name1)} &amp; ${esc(C.name2)}</p>${C.hashtag ? `<p class="dt2">${esc(C.hashtag)}</p>` : ''}</section></main>`;
    return h;
  },

  /* Gerak "digambar ulang": bingkai gelombang bergantian dua versi (bergetar halus seperti sketsa),
     kata muncul bergantian lalu melayang pelan seperti di tema mono; pita bergoyang, bintang berkelip.
     Otomatis mati bila reduce-motion. */
  after(root) {
    Undangan.splitWords(root, '.ttl, .nm, .dt, .dt2, h2, h3, .sm, .gn, .to',
      el => el.closest('form') || el.closest('.count') || el.closest('button'));
  }
});

</script>
<script>Undangan.start(CONFIG);</script>
</body>
