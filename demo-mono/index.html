  const PREMIUM = STANDAR.concat(['livestream', 'video', 'qr']);
  const PACKAGES = {
    basic:   { label: 'Basic',   features: BASIC,   galleryMax: 4 },
    standar: { label: 'Standar', features: STANDAR, galleryMax: 12 },
    premium: { label: 'Premium', features: PREMIUM, galleryMax: 30 }
  };

  const DEFAULTS = {
    package: 'basic',
    guestDefault: 'Tamu Undangan',
    timezone: 'Asia/Jakarta',
    eventDurationHours: 4,
    sections: {},
    events: [], story: [], gallery: [], details: [], banks: [],
    rsvpOptions: ['Hadir', 'Tidak Hadir', 'Masih Ragu'],
    rsvpMessage: 'Halo, saya {tamu}. Konfirmasi: {status}, jumlah {jumlah} orang. Ucapan: {ucapan}',
    giftIntro: 'Doa restu Anda adalah hadiah terindah. Namun bila ingin mengirimkan tanda kasih, dapat melalui:',
    closingText: 'Merupakan kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.',
    hashtag: '',
    coverText: 'Undangan Pernikahan',
    openButton: 'Buka Undangan',
    coverHint: 'Ketuk amplop untuk membuka',
    expiredText: 'Masa aktif undangan ini telah berakhir. Terima kasih atas doa dan kehadirannya.',
    photoGrayscale: false
  };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ZONE = { 'Asia/Jakarta': 'WIB', 'Asia/Makassar': 'WITA', 'Asia/Jayapura': 'WIT' };

  const Undangan = {
    packages: PACKAGES,
    themes: {},
    register(name, theme) { this.themes[name] = theme; },

    /* Pecah teks elemen (yang cocok dengan selector) menjadi kata:
       <span class="w" style="--i:n;--r:±deg"><span class="wi">kata</span></span>
       Dipakai tema untuk animasi kata. `skip(el)` → true bila elemen dilewati. */
    splitWords(root, sel, skip) {
      root.querySelectorAll(sel).forEach(el => {
        if (el.querySelector('.w') || el.closest('.w') || (skip && skip(el))) return;
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        let i = 0;
        nodes.forEach(n => {
          if (!n.textContent.trim()) return;
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(part => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.append(' '); return; }
            const w = document.createElement('span'); w.className = 'w';
            w.style.setProperty('--i', i);
            w.style.setProperty('--r', ((i % 2 ? 1 : -1) * (1 + (i % 3) * .6)).toFixed(1) + 'deg');
            const inner = document.createElement('span'); inner.className = 'wi'; inner.textContent = part;
            w.append(inner); frag.append(w); i++;
          });
          n.replaceWith(frag);
        });
      });
    },

    /* DEMO SAJA: calon pembeli mencoba nama & tanggal sendiri lewat link ?n1=Budi&n2=Ani&tgl=2027-05-20.
       Semua teks yang memuat nama/tanggal lama diganti (nama lengkap, hashtag, rekening, tanggal acara).
       Tidak berlaku untuk undangan klien asli (C.demo kosong) → link klien tidak bisa diubah orang lain. */
    tryNames(C) {
      const q = new URLSearchParams(location.search);
      const clean = v => (v || '').replace(/[<>"&]/g, '').replace(/\s+/g, ' ').trim().slice(0, 24);
      const n1 = clean(q.get('n1')), n2 = clean(q.get('n2')), tgl = q.get('tgl') || '';
      const reps = [];
      const fmt = iso => new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: C.timezone }).format(new Date(iso));
      if (/^\d{4}-\d{2}-\d{2}$/.test(tgl) && !isNaN(new Date(tgl))) {
        const iso = tgl + 'T' + String(C.eventISO).split('T')[1];
        if (!isNaN(new Date(iso))) {
          reps.push([fmt(C.eventISO), fmt(iso)]);
          if (C.hashtag) C.hashtag = C.hashtag.split(String(C.eventISO).slice(0, 4)).join(tgl.slice(0, 4));   // #NadiaArya2026 → tahun baru
          C.eventISO = iso;
        }
      }
      const name = (k, v) => {
        if (!v) return;
        const old = C['name' + k], full = C['fullName' + k];
        if (full) reps.push([full, v]);                                   // nama lengkap lama → nama baru
        if (old) reps.push([old, v], [old.toLowerCase(), v.toLowerCase().replace(/[^a-z0-9]/g, '')]);
        C['name' + k] = v; C['fullName' + k] = v;
      };
      const o1 = C.name1, o2 = C.name2;
      name(1, n1); name(2, n2);
      if (!reps.length) return;
      if (n1 || n2) reps.unshift([`${o1}${o2}`, `${C.name1.split(' ')[0]}${C.name2.split(' ')[0]}`]);   // hashtag #NadiaArya2026 → kata pertama saja (hashtag panjang tidak bisa dipatah & melebarkan halaman)
      const walk = v => typeof v === 'string' ? reps.reduce((s, [a, b]) => a ? s.split(a).join(b) : s, v)
        : Array.isArray(v) ? v.map(walk) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, walk(x)])) : v;
      ['coupleNames', 'hashtag', 'banks', 'events', 'story', 'closingText', 'tagline', 'giftAddress', 'dateDisplay', 'instagram1', 'instagram2', 'shareMessage'].forEach(k => { if (C[k] != null) C[k] = walk(C[k]); });
      C.__tried = true;
    },

    /* tombol "Coba nama kalian" di halaman demo → form kecil → muat ulang dengan ?n1&n2&tgl (parameter ?to dipertahankan) */
    demoPill(C) {
      const b = document.createElement('div'); b.className = 'demo-try';
      const q = new URLSearchParams(location.search);
      b.innerHTML = `<button type="button" class="dt-open">✎ ${C.__tried ? 'Ganti nama' : 'Coba nama kalian'}</button>
        <form class="dt-form" hidden><b>Lihat dengan nama kalian</b>
          <label>Nama wanita<input name="n1" maxlength="24" placeholder="mis. Ani" value="${q.get('n1') ? C.name1 : ''}"></label>
          <label>Nama pria<input name="n2" maxlength="24" placeholder="mis. Budi" value="${q.get('n2') ? C.name2 : ''}"></label>
          <label>Tanggal acara (opsional)<input name="tgl" type="date" value="${(q.get('tgl') || '').replace(/[^0-9-]/g, '')}"></label>
          <div><button type="submit">Tampilkan</button><button type="button" class="dt-x">Tutup</button></div></form>`;
      const css = document.createElement('style');
      css.textContent = `.demo-try{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:120;font:500 13px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;color:#222}
.demo-try .dt-open{border:0;border-radius:999px;padding:8px 13px;background:rgba(255,255,255,.92);color:#222;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;font:inherit;font-weight:600}
.demo-try form{margin-top:8px;width:min(280px,calc(100vw - 20px));padding:14px;border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);display:grid;gap:9px}
.demo-try form[hidden]{display:none}.demo-try label{display:grid;gap:3px;font-size:12px;color:#555;letter-spacing:0;text-transform:none;margin:0}
.demo-try input{font:inherit;font-size:15px;color:#222;border:1px solid #ccc;border-radius:8px;padding:8px 10px;min-height:40px;background:#fff;width:100%}
.demo-try form div{display:flex;gap:8px}.demo-try form button{flex:1;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:700;cursor:pointer;background:#222;color:#fff}.demo-try .dt-x{background:#eee;color:#222}`;
      document.head.appendChild(css); document.body.appendChild(b);
      const f = b.querySelector('form');
      b.querySelector('.dt-open').onclick = () => { f.hidden = !f.hidden; if (!f.hidden) f.n1.focus(); };
      b.querySelector('.dt-x').onclick = () => { f.hidden = true; };
      f.onsubmit = e => {
        e.preventDefault();
        const p = new URLSearchParams(location.search);
        ['n1', 'n2', 'tgl'].forEach(k => { const v = f[k].value.trim(); v ? p.set(k, v) : p.delete(k); });
        try { localStorage.setItem('tb-try', JSON.stringify({ n1: f.n1.value.trim(), n2: f.n2.value.trim(), tgl: f.tgl.value })); } catch (err) { /* penyimpanan diblokir */ }
        location.search = p.toString();
      };
    },

    start(userC) {
      const C = Object.assign({}, DEFAULTS, userC);
      if (C.demo) this.tryNames(C);
      const root = document.getElementById('u-root');
      const slug = C.slug || window.__SLUG || 'undangan';
      const P = PACKAGES[C.package] || PACKAGES.basic;
      /* add-on: fitur di luar paket yang dibeli terpisah → addons: ['music','map','qr', ...]
         tambahan foto galeri → galleryExtra: 8 */
      const addons = C.addons || [];
      const has = k => (P.features.includes(k) || addons.includes(k)) && C.sections[k] !== false;
      const params = new URLSearchParams(location.search);
      const hasGuest = !!(params.get('to') || '').trim();
      const guest = (params.get('to') || C.guestDefault).trim().slice(0, 60);
      const endpoint = C.endpoint || '';
      const names = C.coupleNames || `${C.name1} & ${C.name2}`;
      document.title = `Undangan Pernikahan ${names}`;

      /* ---- masa aktif ---- */
      if (C.activeUntil && Date.now() > new Date(C.activeUntil).getTime()) {
        root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;font:20px/1.4 Georgia,serif;color:#444"><div><h1 style="font-size:34px;margin-bottom:12px">${esc(names)}</h1><p>${esc(C.expiredText)}</p></div></div>`;
        return;
      }

      /* ---- tanggal & jam (otomatis dari eventISO) ---- */
      const d = new Date(C.eventISO), tz = C.timezone;
      const fmt = (loc, o) => new Intl.DateTimeFormat(loc, Object.assign({ timeZone: tz }, o));
      const p = {}; fmt('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).formatToParts(d).forEach(x => p[x.type] = x.value);
      const date = {
        long: fmt('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d),
        dmySpaced: `${p.day} . ${p.month} . ${p.year}`,
        dmyDots: `${p.day}.${p.month}.${p.year}`,
        time: fmt('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }).format(d).replace(':', '.') + ' ' + (ZONE[tz] || '')
      };

      /* kalender bulan acara (untuk tema yang menampilkan kalender): minggu dimulai Senin */
      const cal = (() => {
        const y = +p.year, m = +p.month, day = +p.day;
        return { year: y, month: m, day, monthName: new Intl.DateTimeFormat('id-ID', { month: 'long', timeZone: 'UTC' }).format(new Date(Date.UTC(y, m - 1, 1))),
          daysInMonth: new Date(Date.UTC(y, m, 0)).getUTCDate(), offset: (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7,
          dow: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'] };
      })();

      /* ---- galeri sesuai paket ---- */
      let gal = (C.gallery || []).slice(0, P.galleryMax + (+C.galleryExtra || 0));
      if (!C.demo) gal = gal.filter(Boolean);

      /* ---- kalender ---- */
      const f = x => x.toISOString().replace(/[-:]|\.\d{3}/g, '');
      const en = new Date(d.getTime() + C.eventDurationHours * 36e5);
      const gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent('Pernikahan ' + names)
        + '&dates=' + f(d) + '/' + f(en)
        + '&location=' + encodeURIComponent((C.events[0] && (C.events[0].venue || C.events[0].place) + ', ' + C.events[0].address) || '');

      const ytEmbed = u => { const m = String(u || '').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/); return m ? 'https://www.youtube.com/embed/' + m[1] : ''; };
      /* preview Google Maps (iframe, tanpa API key). Isi `mapQuery` di acara bila ingin pencarian yang lebih tepat. */
      /* Urutan pilihan peta per acara (semua dikunci paket/add-on "map"):
         1. mapImage  = gambar peta sederhana (SVG/PNG/WebP) → dibuat dengan tools/map-sketch.js atau AI. Paling rapi & ringan, tanpa Google.
         2. lat+lng   = embed Google Maps tepat di titik itu dengan zoom (mapZoom, default 17). Koordinat juga dibaca otomatis dari mapsURL
                        bila memuat "@lat,lng" / "!3d..!4d.." / "q=lat,lng".
         3. mapQuery / venue+alamat = pencarian teks (bisa meleset sampai tampil satu pulau → lebih baik pakai 1 atau 2). */
      const coords = e => {
        if (isFinite(e.lat) && isFinite(e.lng) && e.lat !== '' && e.lng !== '' && e.lat != null) return [+e.lat, +e.lng];
        const u = String(e.mapsURL || ''), m = u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || u.match(/[?&](?:q|ll|query)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/);
        return m ? [+m[1], +m[2]] : null;
      };
      const mapSrc = e => {
        if (!has('map') || e.mapEmbed === false || e.mapImage) return '';
        const c = coords(e);
        if (c) return `https://maps.google.com/maps?q=${c[0]},${c[1]}&z=${+e.mapZoom || 17}&output=embed`;
        const q = e.mapQuery || [e.venue || e.place, e.address].filter(Boolean).join(', ');
        return q ? 'https://maps.google.com/maps?q=' + encodeURIComponent(q) + '&output=embed' : '';
      };
      const mapBox = e => {
        if (has('map') && e.mapEmbed !== false && e.mapImage) return `<div class="map sketch"><img src="${esc(e.mapImage)}" alt="Peta lokasi ${esc(e.venue || e.place || '')}" loading="lazy"></div>`;
        return mapSrc(e) ? `<div class="map"><iframe src="${esc(mapSrc(e))}" title="Peta ${esc(e.venue || e.place || '')}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>` : '';
      };
      const img = (src, alt, cls) => src ? `<img class="${cls || ''}" src="${esc(src)}" alt="${esc(alt || '')}" loading="lazy">` : `<div class="ph">Foto</div>`;

      const H = {
        C, has, esc, guest, hasGuest, gal, gcal, img, ytEmbed, mapBox, coords, date, cal, names, slug, endpoint,
        pkg: P, setVar: (k, v) => v && document.documentElement.style.setProperty(k, v)
      };

      /* ---- foto bantu untuk tema berbasis foto ---- */
      const heroSrc = C.heroPhoto || (C.gallery || [])[0] || C.photo1 || '';
      H.heroSrc = heroSrc;
      H.pic = i => (C.gallery || [])[i] || (C.gallery || [])[i % Math.max(1, (C.gallery || []).length)] || heroSrc;   // foto ke-i (berputar bila galeri sedikit)
      H.dparts = { d: p.day, m: p.month, y: p.year.slice(2), year: p.year };
      H.mono = [String(C.name1 || '?')[0].toUpperCase(), String(C.name2 || '?')[0].toUpperCase()];   // inisial untuk monogram                                          // "30" "11" "25"

      /* ---- BLOK BAKU: isi bagian yang sama di semua tema (tema cukup membungkus + memberi gaya lewat class) ----
         Tiap fungsi mengembalikan '' bila fitur tidak aktif di paket / datanya kosong.
         Class: .ev .ev-t .ev-d .ev-h .ev-p | .st .it .yr | .det | .gal .g | .vid | .bank | form[data-rsvp] .wishes | .qr  ·  tombol: .btn (.ghost .sm) */
      const blink = (href, label, cls) => `<a class="btn ${cls || 'sm'}" href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;
      H.blocks = {
        events(o = {}) {
          if (!has('events')) return '';
          return C.events.map(e => `<div class="ev"><h3 class="ev-t">${esc(e.title)}</h3>${e.dateText ? `<p class="ev-d">${esc(e.dateText)}</p>` : ''}<p class="ev-h">${esc(e.timeText)}</p>
            <p class="ev-p"><b>${esc(e.venue)}</b><br>${esc(e.address)}</p>${mapBox(e)}${e.mapsURL ? blink(e.mapsURL, esc(o.mapLabel || 'Lihat Lokasi')) : ''}</div>`).join('')
            + (has('livestream') && C.livestreamURL ? blink(C.livestreamURL, '▶ Live Streaming') : '');
        },
        story: () => has('story') && C.story.length ? `<div class="st">${C.story.map(s => `<div class="it"><div class="yr">${esc(s.date)}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('')}</div>` : '',
        /* butir "Dress Code" dilewati bila C.dressCode diisi (sudah tampil di blok dresscode → tidak dobel) */
        details: () => {
          const list = has('details') ? (C.details || []).filter(x => !(C.dressCode && /dress\s*-?\s*code/i.test(x.h || ''))) : [];
          return list.length ? list.map(x => `<div class="det"><h3>${esc(x.h)}</h3><p>${esc(x.t)}</p></div>`).join('') : '';
        },
        gallery: () => has('gallery') && gal.length ? `<div class="gal">${gal.map(g => `<div class="g" data-src="${esc(g)}">${img(g, 'Galeri')}</div>`).join('')}</div>` : '',
        video: () => has('video') && ytEmbed(C.videoURL) ? `<div class="vid"><iframe src="${ytEmbed(C.videoURL)}" allowfullscreen loading="lazy" title="Video"></iframe></div>` : '',
        gift: () => has('gift') && (C.banks.length || C.giftAddress) ? `<p class="intro">${esc(C.giftIntro)}</p>`
          + C.banks.map(b => `<div class="bank"><span>${esc(b.bank)}</span><strong>${esc(b.number)}</strong><span>a.n. ${esc(b.name)}</span><button class="btn ghost sm" data-copy="${esc(b.number)}">Salin Nomor</button></div>`).join('')
          + (C.giftAddress ? `<div class="bank"><strong>Kirim Kado</strong><span>${esc(C.giftAddress)}</span><button class="btn ghost sm" data-copy="${esc(C.giftAddress)}">Salin Alamat</button></div>` : '') : '',
        rsvp() {
          if (!has('rsvp')) return '';
          const w = has('wishes');
          return `${C.rsvpNote ? `<p class="intro">${esc(C.rsvpNote)}</p>` : ''}<form data-rsvp>
            <label>Nama</label><input name="fn" required value="${hasGuest ? esc(guest) : ''}">
            <label>Kehadiran</label><select name="st">${C.rsvpOptions.map(o => `<option>${esc(o)}</option>`).join('')}</select>
            <label>Jumlah tamu</label><select name="fj">${[1, 2, 3, 4, 5].map(n => `<option>${n}</option>`).join('')}</select>
            <label>Ucapan &amp; doa</label><textarea name="fm" rows="3"></textarea>
            <div class="row">${w ? `<button class="btn" type="submit">Kirim</button>` : ''}${C.rsvpPhone ? `<button class="btn ${w ? 'ghost' : ''}" type="${w ? 'button' : 'submit'}" data-act="wa">Kirim via WhatsApp</button>` : ''}</div>
          </form>${w ? `<div class="wishes" data-wishes></div>` : ''}`;
        },
        /* kalender bulan acara: grid 7 kolom (Senin pertama); hari H diberi class .on */
        calendar: () => {
          const cells = []; for (let i = 0; i < cal.offset; i++) cells.push('<i></i>');
          for (let d = 1; d <= cal.daysInMonth; d++) cells.push(d === cal.day ? `<b class="on" aria-label="Hari H">${d}</b>` : `<span>${d}</span>`);
          return `<div class="calw"><p class="calm">${esc(cal.monthName)} ${cal.year}</p><div class="cal">${cal.dow.map(x => `<em>${x}</em>`).join('')}${cells.join('')}</div></div>`;
        },
        /* program hari-H: dari C.timeline [{time,text,note}] atau otomatis dari acara */
        program: () => {
          if (!has('events')) return '';
          const items = (C.timeline && C.timeline.length) ? C.timeline : (C.events || []).map(e => ({ time: String(e.timeText || '').replace(/\s*(WIB|WITA|WIT)\s*$/i, ''), text: e.title }));
          return items.length ? `<div class="prog">${items.map(i => `<div class="pr"><b>${esc(i.time)}</b><span>${esc(i.text)}</span>${i.note ? `<small>${esc(i.note)}</small>` : ''}</div>`).join('')}</div>` : '';
        },
        /* dress code: C.dressCode = { text, colors:["#hex",…] } → teks + lingkaran warna (.sw i) */
        dresscode: () => {
          const d = C.dressCode; if (!has('details') || !d) return '';
          const cols = (d.colors || []).filter(c => /^#[0-9a-f]{3,8}$/i.test(c) || /^[a-z]+$/i.test(c));
          return (d.text || cols.length) ? `<div class="dc">${d.text ? `<p>${esc(d.text)}</p>` : ''}${cols.length ? `<div class="sw">${cols.map(c => `<i style="background:${c}"></i>`).join('')}</div>` : ''}</div>` : '';
        },
        qr: () => has('qr') && hasGuest ? `<p class="intro">Tunjukkan QR ini saat tiba.</p><div class="qr" data-qr></div><p class="qrn"><b>${esc(guest)}</b></p>` : ''
      };

      const theme = this.themes[C.theme];
      if (!theme) { root.textContent = 'Tema tidak ditemukan: ' + C.theme; return; }
      root.innerHTML = theme.render(C, H) + `
        <button class="music mp-${esc(C.musicPlayer || theme.player || PLAYER[C.theme] || 'doodle')}" id="music" aria-label="Putar atau jeda musik" aria-pressed="false"><span class="mp-i">♪</span><i class="mp-eq"><b></b><b></b><b></b></i><span class="mp-t">Musik</span></button>
        <audio id="audio" loop preload="none"></audio>
        <div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Foto galeri"><img alt=""></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>`;
      /* nama tamu diisi SEBELUM tema memproses teks (mis. memecah jadi kata) */
      $$('[data-guest]').forEach(el => el.textContent = guest);
      if (theme.base) {
        const b = document.createElement('style'); b.id = 'ubase';
        b.textContent = `
.rv{opacity:0;translate:0 28px;transition:opacity .9s ease,translate .9s cubic-bezier(.22,1,.36,1)}.rv.above{translate:0 -28px}.rv.in{opacity:1;translate:0 0}
.w,.wi{display:inline-block}.rv:not(.in) .w{opacity:0}
.rv.in .w,.cover .w{animation:uFadeUp .9s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(min(var(--i),18)*70ms)}.cover .w{animation-delay:calc(min(var(--i),18)*90ms + .25s)}
@keyframes uFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:41;width:44px;height:44px;border-radius:50%;background:var(--u-ink,#111);color:var(--u-bg,#fff);border:0;cursor:pointer;font-size:17px;display:none;align-items:center;justify-content:center}
.music.show{display:flex}.music.on{animation:uSpin 4s linear infinite}@keyframes uSpin{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}.lightbox.show{display:flex}.lightbox img{max-width:100%;max-height:90vh}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);background:var(--u-ink,#111);color:var(--u-bg,#fff);padding:9px 22px;z-index:95;transition:transform .4s}.toast.show{transform:translate(-50%,0)}
form{text-align:left}label{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:14px 0 4px}
input,select,textarea{width:100%;min-height:44px;font:inherit;font-size:16px;color:inherit;background:transparent;border:0;border-bottom:1.5px solid currentColor;padding:8px 0;outline:none;border-radius:0}textarea{border:1.5px solid currentColor;padding:8px;resize:vertical;min-height:84px}option{color:#111}

.qr{width:180px;margin:10px auto;background:#fff;padding:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;text-align:center}.cal em{font-style:normal;font-size:11px;opacity:.7}.cal span,.cal b{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-weight:inherit}
.sw{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}.sw i{width:44px;height:44px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.prog{display:grid;gap:14px}.pr{display:grid;gap:2px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv .w{opacity:1!important}}`;
        document.head.insertBefore(b, document.head.firstChild);
      }
      if (theme.after) theme.after(root, C, H);
      if (C.demo && !new URLSearchParams(location.search).has('shot')) this.demoPill(C);

      /* ---------------- perilaku ---------------- */
      const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); };
      const post = o => endpoint && fetch(endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ slug }, o)) }).catch(() => {});

      /* buka cover */
      const cover = $('[data-cover]'), audio = $('#audio'), music = $('#music');
      document.body.style.overflow = cover ? 'hidden' : '';
      if (has('music') && C.musicURL) {
        audio.src = C.musicURL; music.classList.add('show');
        if (!$('#umusic')) { const st = document.createElement('style'); st.id = 'umusic'; st.textContent = PLAYER_CSS; document.head.appendChild(st); }
        /* warna pemutar ikut tema: latar & teks halaman + warna tombol pertama (bisa ditimpa --mp-bg/--mp-fg/--mp-ac di CSS tema) */
        const css = getComputedStyle(document.body), clear = c => !c || /rgba\(0, 0, 0, 0\)|transparent/.test(c);
        const btn = $$('.btn, button:not(#music)').map(b => getComputedStyle(b).backgroundColor).find(c => !clear(c));
        const bg = clear(css.backgroundColor) ? getComputedStyle(document.documentElement).backgroundColor : css.backgroundColor;
        const own = v => getComputedStyle(music).getPropertyValue(v).trim();
        if (!own('--mp-bg')) music.style.setProperty('--mp-bg', clear(bg) ? '#fff' : bg);
        if (!own('--mp-fg')) music.style.setProperty('--mp-fg', css.color || '#111');
        if (!own('--mp-ac')) music.style.setProperty('--mp-ac', btn || css.color || '#111');
      }
      /* tombol mengikuti status audio sebenarnya (play/pause dari mana pun) */
      const sync = () => { const on = !audio.paused; music.classList.toggle('on', on); music.setAttribute('aria-pressed', on); $('.mp-t', music).textContent = on ? 'Musik' : 'Putar'; };
      audio.addEventListener('play', sync); audio.addEventListener('pause', sync);
      music.onclick = () => {
        if (audio.paused) audio.play().catch(() => toast('Musik tidak bisa diputar'));
        else audio.pause();
      };
      /* hemat baterai/kuota: jeda musik saat tab disembunyikan, lanjut bila tadinya menyala */
      let resume = false;
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { resume = !audio.paused; audio.pause(); }
        else if (resume) { resume = false; audio.play().catch(() => {}); }
      });
      let opened = false;
      $$('[data-open]').forEach(b => { if (b.tagName !== 'BUTTON') b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } }); });
      $$('[data-open]').forEach(b => b.addEventListener('click', () => {
        if (opened) return; opened = true;
        if (cover) {
          cover.classList.add('opened');
          setTimeout(() => { cover.classList.add('hide'); document.body.style.overflow = ''; window.scrollTo(0, 0); startReveal(); }, +(cover.dataset.delay || 0));
        } else startReveal();
        if (has('music') && C.musicURL) audio.play().catch(() => {});
        if (has('track') && hasGuest) post({ type: 'open', name: guest });
      }));

      /* hitung mundur */
      const target = d.getTime();
      const tick = () => {
        const t = Math.max(0, target - Date.now());
        const v = { d: Math.floor(t / 864e5), h: Math.floor(t % 864e5 / 36e5), m: Math.floor(t % 36e5 / 6e4), s: Math.floor(t % 6e4 / 1e3) };
        $$('[data-cd]').forEach(el => el.textContent = v[el.dataset.cd]);
      };
      tick(); setInterval(tick, 1000);

      /* salin nomor */
      document.addEventListener('click', async e => {
        const b = e.target.closest('[data-copy]'); if (!b) return;
        try { await navigator.clipboard.writeText(b.dataset.copy); }
        catch { const t = document.createElement('textarea'); t.value = b.dataset.copy; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
        toast('Berhasil disalin ✓');
      });

      /* lightbox: ketuk foto → besar; panah/geser untuk foto berikutnya; Esc/ketuk latar untuk menutup */
      const lb = $('#lb'), lbImg = $('img', lb);
      const pics = $$('[data-src]').filter(g => g.dataset.src);
      let cur = -1, lastFocus = null;
      const lbStyle = document.createElement('style');
      lbStyle.textContent = '.lb-b{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#111;font:700 26px/1 system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}'
        + '.lb-b:focus-visible{outline:3px solid #fff;outline-offset:2px}.lb-p{left:10px}.lb-n{right:10px}'
        + '.lb-x{top:calc(14px + env(safe-area-inset-top));right:10px;transform:none;width:44px;height:44px;font-size:22px}'
        + '.lb-c{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font:14px system-ui,sans-serif;pointer-events:none}';
      document.head.appendChild(lbStyle);
      const mapStyle = document.createElement('style');
      mapStyle.textContent = '.map.sketch{background:transparent}.map.sketch>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;filter:none!important}';
      document.head.appendChild(mapStyle);
      const mk = (cls, label, txt, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'lb-b ' + cls; b.setAttribute('aria-label', label); b.textContent = txt; b.onclick = e => { e.stopPropagation(); fn(); }; lb.appendChild(b); return b; };
      const counter = document.createElement('div'); counter.className = 'lb-c'; lb.appendChild(counter);
      const show = i => {
        cur = (i + pics.length) % pics.length;
        lbImg.src = pics[cur].dataset.src; lbImg.alt = (pics[cur].querySelector('img') || {}).alt || 'Foto galeri';
        lbImg.style.filter = C.photoGrayscale ? 'grayscale(1)' : 'none';
        counter.textContent = pics.length > 1 ? `${cur + 1} / ${pics.length}` : '';
        if (!lb.classList.contains('show')) { lastFocus = document.activeElement; lb.classList.add('show'); }
        xBtn.focus();
      };
      const hide = () => { if (!lb.classList.contains('show')) return; lb.classList.remove('show'); if (lastFocus && lastFocus.focus) lastFocus.focus(); };
      const prevBtn = mk('lb-p', 'Foto sebelumnya', '‹', () => show(cur - 1));
      const nextBtn = mk('lb-n', 'Foto berikutnya', '›', () => show(cur + 1));
      const xBtn = mk('lb-x', 'Tutup', '✕', hide);
      if (pics.length < 2) { prevBtn.style.display = nextBtn.style.display = 'none'; }
      pics.forEach((g, i) => {
        g.tabIndex = 0; g.setAttribute('role', 'button'); g.setAttribute('aria-label', 'Perbesar foto ' + (i + 1));
        g.addEventListener('click', () => show(i));
        g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(i); } });
      });
      lb.onclick = hide;
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('show')) return;
        if (e.key === 'Escape') hide();
        else if (e.key === 'ArrowLeft') show(cur - 1);
        else if (e.key === 'ArrowRight') show(cur + 1);
      });
      let sx = 0;
      lb.addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50 && pics.length > 1) show(cur + (dx < 0 ? 1 : -1)); }, { passive: true });

      /* RSVP + ucapan */
      const form = $('[data-rsvp]');
      if (form) {
        const val = n => ((form.elements[n] && form.elements[n].value) || '').trim();
        const wa = () => {
          if (!C.rsvpPhone) return toast('Nomor WhatsApp belum diatur');
          const v = { tamu: val('fn') || guest, status: val('st'), jumlah: val('fj'), ucapan: val('fm') || '-' };
          const m = C.rsvpMessage.replace(/\{(tamu|status|jumlah|ucapan)\}/g, (_, k) => v[k]);   // fungsi, bukan string: ucapan berisi $& tidak merusak pesan
          window.open(`https://wa.me/${C.rsvpPhone}?text=${encodeURIComponent(m)}`, '_blank');
        };
        $$('[data-act=wa]', form).forEach(b => b.addEventListener('click', wa));

        if (has('wishes')) {
          const KEY = 'wishes:' + slug;
          const local = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
          let remote = [];
          const box = $('[data-wishes]');
          const render = () => {
            if (!box) return;
            const list = (endpoint ? remote : local()).slice().sort((a, b) => (b.time || 0) - (a.time || 0));
            box.innerHTML = '';
            if (!list.length) { box.innerHTML = '<p style="text-align:center">Jadilah yang pertama memberi ucapan ♥</p>'; return; }
            list.forEach(w => {
              const row = document.createElement('div'); row.className = 'wish';
              const b = document.createElement('b'); b.textContent = w.name;
              const t = document.createElement('span'); t.className = 'tag'; t.textContent = w.status;
              const m = document.createElement('p'); m.textContent = w.message;
              row.append(b, t, m); box.appendChild(row);
            });
          };
          if (endpoint) fetch(`${endpoint}?type=wishes&slug=${encodeURIComponent(slug)}`).then(r => r.json()).then(j => { remote = Array.isArray(j) ? j : []; render(); }).catch(() => {});
          render();
          /* anti-bot: kolom jebakan tak terlihat (manusia tak mengisinya) + jeda antar kiriman */
          const trap = document.createElement('input');
          trap.type = 'text'; trap.name = 'website'; trap.tabIndex = -1; trap.autocomplete = 'off'; trap.setAttribute('aria-hidden', 'true');
          trap.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;opacity:0';
          form.appendChild(trap);
          let lastSend = 0;
          /* ID acak per perangkat: kirim ulang dari perangkat yang sama MEMPERBARUI konfirmasi lama (tidak dobel) */
          const rid = (() => { try { let r = localStorage.getItem('rid:' + slug); if (!r) { r = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('rid:' + slug, r); } return r; } catch { return Math.random().toString(36).slice(2); } })();
          form.addEventListener('submit', e => {
            e.preventDefault();
            const w = { name: val('fn'), status: val('st'), jumlah: val('fj'), message: val('fm'), time: Date.now() };
            if (!w.name) return;
            if (trap.value) return;                                   // bot
            if (Date.now() - lastSend < 15000) return toast('Sebentar ya, baru saja terkirim');
            lastSend = Date.now();
            if (endpoint) { post(Object.assign({ type: 'rsvp', rid }, w)); if (w.message) remote = [Object.assign({ mine: true }, w)].concat(remote.filter(x => !x.mine)); }
            else try { localStorage.setItem(KEY, JSON.stringify([w].concat(local()))); } catch {}
            render(); const m = form.elements['fm']; if (m) m.value = ''; toast('Terkirim, terima kasih ♥');
          });
        } else {
          form.addEventListener('submit', e => { e.preventDefault(); wa(); });
        }
      }

      /* QR check-in (premium) */
      const qrBox = $('[data-qr]');
      if (qrBox && has('qr') && hasGuest) {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
        s.onload = () => { const q = qrcode(0, 'M'); q.addData(`U1|${slug}|${guest}`); q.make(); qrBox.innerHTML = q.createSvgTag({ scalable: true, margin: 2 }); };
        document.head.appendChild(s);
      }

      /* animasi masuk & keluar saat scroll, DUA ARAH:
         scroll turun → elemen naik dari bawah; scroll naik → elemen turun dari atas.
         Dimulai setelah cover dibuka. Menghormati pengaturan "reduce motion". */
      let revealStarted = false;
      function startReveal() {
        if (revealStarted) return; revealStarted = true;
        const items = $$('.rv');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { items.forEach(el => el.classList.add('in')); return; }
        const io = new IntersectionObserver(es => es.forEach(x => {
          const el = x.target;
          if (x.isIntersecting) { el.classList.remove('above'); el.classList.add('in'); }
          else { el.classList.remove('in'); el.classList.toggle('above', x.boundingClientRect.top < innerHeight / 2); }
        }), { threshold: 0.05, rootMargin: '-8% 0px -8% 0px' });
        items.forEach(el => io.observe(el));
      }
      if (!cover) startReveal();
    }
  };
  window.Undangan = Undangan;
})();

</script>
<script>
/* TEMA MONO — tulisan tangan, tinta biru di atas abu-abu (dari undangan.html) */
Undangan.register('mono', {
  render(C, H) {
    const { esc, has, date } = H;
    H.setVar('--bg', C.colorBg); H.setVar('--ink', C.colorInk);
    const gs = C.photoGrayscale !== false ? 'bw' : 'bw nogs';
    const sparkle = `<svg class="divider" viewBox="0 0 64 70" stroke-width="0"><path d="M22 4C24 22 28 30 42 36 28 42 24 50 22 68 20 50 16 42 2 36 16 30 20 22 22 4Z"/><path d="M50 20C51 28 53 31 59 33 53 35 51 38 50 46 49 38 47 35 41 33 47 31 49 28 50 20Z"/></svg>`;
    const tag = C.tagline || '';

    let h = `
    <section class="cover" data-cover>
      <div style="font-size:22px">${esc(C.coverText)}</div>
      <h1>${esc(C.name1)} &amp; ${esc(C.name2)}</h1>
      <div>Kepada Yth.</div><div class="guest" data-guest></div>
      <button class="btn" data-open>${esc(C.openButton)}</button>
    </section>
    <main class="wrap">`;

    /* hero */
    h += `<section id="hero">
      <h1 class="names rv"><span class="n1">${esc(C.name1)}</span><span class="amp">&amp;</span><span class="n2">${esc(C.name2)}</span></h1>
      <div class="photo rv${C.heroCutout ? ' cut' : ''}"><div class="frame">${C.heroCutout ? '' : H.img(C.heroPhoto, H.names, gs)}</div>
        ${C.heroCutout ? `<img class="cutimg" src="${esc(C.heroCutout)}" alt="${esc(H.names)}" fetchpriority="high">` : ''}
        <svg class="doodle d1" viewBox="0 0 64 90" stroke-width="3"><path class="f" d="M22 4C24 22 28 30 42 36 28 42 24 50 22 68 20 50 16 42 2 36 16 30 20 22 22 4Z"/><path class="f" d="M50 20C51 28 53 31 59 33 53 35 51 38 50 46 49 38 47 35 41 33 47 31 49 28 50 20Z"/><path class="f" d="M40 52C41 58 42 60 47 62 42 64 41 66 40 72 39 66 38 64 33 62 38 60 39 58 40 52Z"/></svg>
        <svg class="doodle d2" viewBox="0 0 90 170" stroke-width="3.5"><path class="f" d="M30 6 36 20 52 22 40 32 44 48 30 40 16 48 20 32 8 22 24 20Z"/><path d="M44 66C36 100 22 120 34 150 40 128 30 100 44 66Z"/><path d="M60 78C66 100 52 130 50 158"/><circle cx="68" cy="68" r="6"/></svg>
      </div>
      <p class="tagline rv">${esc(tag)}</p>
      <h2 class="date rv">${esc(C.dateText || date.long).replace(/,\s*/, ',<br>')}</h2>
      <div class="count rv"><div><b data-cd="d">0</b><small>Hari</small></div><div><b data-cd="h">0</b><small>Jam</small></div><div><b data-cd="m">0</b><small>Menit</small></div><div><b data-cd="s">0</b><small>Detik</small></div></div>
      <div class="row rv"><a class="btn outline sm" href="${H.gcal}" target="_blank" rel="noopener">+ Simpan ke Kalender</a></div>
    </section>`;

    if (has('quote') && C.quote && C.quote.text) h += `<section class="quote rv">${sparkle}<p>“${esc(C.quote.text)}”</p><cite>${esc(C.quote.source)}</cite></section>`;

    if (has('couple')) {
      const person = (full, par, ig, ph) => `<div class="person rv">${ph ? `<div class="pic">${H.img(ph, full, gs)}</div>` : ''}<h3>${esc(full)}</h3><p>${esc(par)}</p>${ig ? `<p><a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a></p>` : ''}</div>`;
      h += `<section id="couple"><h2 class="title rv">Mempelai</h2>${person(C.fullName1, C.parents1, C.instagram1, C.photo1)}<div class="and rv">&amp;</div>${person(C.fullName2, C.parents2, C.instagram2, C.photo2)}</section>`;
    }

    if (has('events')) {
      h += `<section id="events"><h2 class="title rv">Acara</h2>` + C.events.map(e => `
        <div class="card ev rv"><h3>${esc(e.title)}</h3><div class="d">${esc(e.dateText || date.long)}</div><p>${esc(e.timeText)}</p>
        <p style="margin-top:10px"><b>${esc(e.venue)}</b></p><p>${esc(e.address)}</p>
        ${H.mapBox(e)}
        ${e.mapsURL ? `<div class="row"><a class="btn sm" href="${esc(e.mapsURL)}" target="_blank" rel="noopener">Lihat Lokasi</a></div>` : ''}</div>`).join('') +
        (has('livestream') && C.livestreamURL ? `<div class="row rv"><a class="btn outline" href="${esc(C.livestreamURL)}" target="_blank" rel="noopener">▶ Tonton Live Streaming</a></div>` : '') + `</section>`;
    }

    if (has('story') && C.story.length) h += `<section id="story"><h2 class="title rv">Love Story</h2><div class="tl">` +
      C.story.map(s => `<div class="it rv"><div class="yr">${esc(s.date)}</div><div class="tt">${esc(s.title)}</div><p>${esc(s.text)}</p></div>`).join('') + `</div></section>`;

    if (has('details') && C.details.length) h += `<section id="details"><h2 class="title rv">Info Penting</h2>` +
      C.details.map(x => `<div class="card rv" style="text-align:left"><div class="brush" style="font-size:26px">${esc(x.h)}</div><p>${esc(x.t)}</p></div>`).join('') + `</section>`;

    if (has('gallery') && H.gal.length) {
      h += `<section id="gallery"><h2 class="title rv">Galeri</h2><div class="gal rv">` + H.gal.map(g => `<div class="g" data-src="${esc(g)}">${H.img(g, 'Galeri', gs)}</div>`).join('') + `</div></section>`;
    }

    if (has('video') && H.ytEmbed(C.videoURL)) h += `<section id="video"><h2 class="title rv">Video</h2><div class="vid rv"><iframe src="${H.ytEmbed(C.videoURL)}" allowfullscreen loading="lazy"></iframe></div></section>`;

    if (has('gift') && (C.banks.length || C.giftAddress)) {
      h += `<section id="gift"><h2 class="title rv">Amplop Digital</h2><p class="hand rv" style="margin-bottom:16px">${esc(C.giftIntro)}</p>` +
        C.banks.map(b => `<div class="card bank rv"><div class="bn">${esc(b.bank)}</div><div class="no">${esc(b.number)}</div><div class="an">a.n. ${esc(b.name)}</div><button class="btn sm" data-copy="${esc(b.number)}">Salin Nomor</button></div>`).join('') +
        (C.giftAddress ? `<div class="card bank rv"><div class="bn">Kirim Kado</div><p style="margin:6px 0 10px">${esc(C.giftAddress)}</p><button class="btn sm" data-copy="${esc(C.giftAddress)}">Salin Alamat</button></div>` : '') + `</section>`;
    }

    if (has('rsvp')) {
      const w = has('wishes');
      h += `<section id="wishes"><h2 class="title rv">RSVP${w ? ' &amp;<br>Ucapan' : ''}</h2><div class="card rv"><form data-rsvp>
        <label>Nama</label><input name="fn" required value="${H.hasGuest ? esc(H.guest) : ''}" placeholder="Nama kamu">
        <label>Kehadiran</label><select name="st">${C.rsvpOptions.map(o => `<option>${esc(o)}</option>`).join('')}</select>
        <label>Jumlah Tamu</label><select name="fj">${[1, 2, 3, 4, 5].map(n => `<option>${n}</option>`).join('')}</select>
        <label>Ucapan &amp; Doa</label><textarea name="fm" placeholder="Tulis ucapan untuk kedua mempelai…"></textarea>
        <div class="row">${w ? `<button class="btn" type="submit">Kirim Ucapan</button>` : ''}${C.rsvpPhone ? `<button class="btn ${w ? 'outline' : ''}" type="${w ? 'button' : 'submit'}" data-act="wa">Kirim via WhatsApp</button>` : ''}</div>
      </form></div>${w ? `<div class="wishes" data-wishes></div>` : ''}</section>`;
    }

    if (has('qr') && H.hasGuest) h += `<section><h2 class="title rv">QR Tamu</h2><div class="card rv"><p>Tunjukkan QR ini saat tiba.</p><div class="qr" data-qr></div><p class="brush" style="font-size:24px">${esc(H.guest)}</p></div></section>`;

    h += `<section class="closing rv">${sparkle}<p class="hand">${esc(C.closingText)}</p><div class="brush">${esc(C.name1)} &amp; ${esc(C.name2)}</div><div class="hash">${esc(C.hashtag)}</div></section></main>`;
    return h;
  },

  /* Kata-kata bergerak "cozy": judul & teks pendek dipecah per kata.
     - masuk: tiap kata muncul bergantian (naik pelan + sedikit miring)
     - diam: kata di judul melayang naik-turun sangat pelan seperti bernapas
     Gerak diatur di theme.css (dan otomatis mati bila perangkat memilih reduce motion). */
  after(root) {
    const sel = '.cover h1, .cover .guest, .names span, h2.title, .date, .tagline, .quote p, .quote cite, .hand, ' +
      '.person h3, .person p, .and, .ev h3, .ev .d, .tl .yr, .tl .tt, .bn, .closing .brush, .closing .hash';
    Undangan.splitWords(root, sel);
  }
});

</script>
<script>Undangan.start(CONFIG);</script>
</body>
</html>
