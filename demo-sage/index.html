:root{--green:#4a6242;--sage:#8a9a78;--band:#5b7051;--paper:#f4efe3;--paper-2:#ebe4d3;--line:#b5a57f;--ink:var(--green)}

html{scroll-behavior:smooth}
body{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--green);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;

#u-root{display:contents}
/* ===== tipografi ===== */
.script{font-family:'Pinyon Script',cursive;font-weight:400;color:var(--green);line-height:1.05}
.names{font-size:clamp(48px,14vw,64px);margin:4px 0 10px}
.title{font-size:clamp(40px,11.5vw,52px);margin:2px 0 4px}
.lead{font-size:clamp(17px,4.6vw,19px);line-height:1.45;max-width:330px;margin:0 auto}
.small{font-size:clamp(15px,3.9vw,16.5px);line-height:1.45}
.eyebrow{font-family:'Cormorant SC','Cormorant Garamond',serif;font-size:13px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--sage);margin-bottom:8px}
.leaf{display:block;width:110px;margin:0 auto 4px;color:var(--line)}
/* ===== bingkai lengkung ===== */
.arch{position:relative;width:min(78%,280px);margin:6px auto 4px;padding:26px 14px 14px;border:1px solid var(--line);border-radius:999px 999px 10px 10px;background:linear-gradient(180deg,rgba(138,154,120,.16),rgba(255,255,255,.35) 70%)}
.arch::before{content:"";position:absolute;inset:6px;border:1px solid rgba(181,165,127,.45);border-radius:inherit;pointer-events:none}
.arch.big{width:min(84%,300px)}.arch.sm{width:min(52%,180px);padding:18px 10px 10px}
.illus{width:100%;margin:0 auto;display:block;overflow:visible}
.illus .ln{fill:none;stroke:var(--green);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* ===== cover ===== */
.cover{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--paper);overflow:hidden;transition:opacity .9s ease,visibility .9s ease,transform .9s ease}
.cover.hide{opacity:0;visibility:hidden;transform:scale(1.04)}
.cv{position:relative;width:min(100%,420px);text-align:center}
.cover .arch{width:min(66%,250px)}
.cdate{font-size:20px;letter-spacing:.3em;margin:0 0 4px}
.sprig{position:absolute;width:130px;color:var(--sage);opacity:.75;pointer-events:none}
.sprig.s-tl{top:-14px;left:-26px}.sprig.s-br{bottom:-14px;right:-26px;transform:rotate(180deg)}
.guest{margin:14px 0 18px}.guest .to{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--sage)}.guest .nm{font-size:24px;font-weight:600;margin-top:2px}
/* ===== badan undangan ===== */
.stack{width:min(100%,460px);margin:0 auto;padding:0 0 70px;background:var(--paper);box-shadow:0 0 50px rgba(80,70,50,.18);min-height:100vh}
.sec{position:relative;padding:54px 26px;text-align:center}
.sec+.sec:not(.band)::before{content:"";position:absolute;top:0;left:50%;width:1px;height:30px;background:var(--line);opacity:.7}
.sec.band+.sec::before,.sec.hero::before{display:none}
.band{background:var(--band);color:var(--paper)}
.band .script,.band .eyebrow,.band .title{color:var(--paper)}.band .eyebrow{opacity:.8}.band .leaf{color:#d8ccaa}
.band .btn{background:var(--paper);color:var(--band);border-color:var(--paper)}
.band .btn.ghost{background:transparent;color:var(--paper)}
.hero{padding-top:44px}
/* blok tanggal: hari | angka | bulan */
.dblock{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;max-width:300px;margin:22px auto 26px}
.dblock span{font-size:15px;letter-spacing:.22em;text-transform:uppercase;line-height:1.3;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dblock b{font-size:56px;font-weight:500;line-height:1}
.events{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ev h3{font-size:clamp(19px,5vw,22px);font-weight:600}
.ev .time{font-size:clamp(18px,4.8vw,21px);margin:2px 0 6px}
.ev .place{font-size:16px;line-height:1.4;margin-bottom:6px}
.events .ev{padding:12px 6px;border:1px solid rgba(181,165,127,.6);border-radius:80px 80px 6px 6px}

.card .eyebrow{color:var(--sage);opacity:1}
.card .btn{background:var(--band);color:var(--paper);border-color:var(--band)}

.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--green)}
.btn.sm{padding:8px 20px;font-size:12.5px;margin-top:10px}
/* ===== hitung mundur ===== */

.count div{width:66px;height:66px;border:1px solid rgba(244,239,227,.55);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.count b{font-size:26px;font-weight:500;line-height:1}

.vid{position:relative;aspect-ratio:16/9;margin-top:12px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.bank{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}

form{display:grid;gap:12px;text-align:left;margin-top:14px}
label{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage)}
input,select,textarea{width:100%;min-height:44px;font:inherit;font-size:18px;color:var(--green);background:rgba(255,255,255,.55);border:1px solid rgba(138,154,120,.55);padding:10px 12px;border-radius:8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green);background:#fff}
form .btn{width:100%}
.wishes{margin-top:22px;max-height:360px;overflow:auto;text-align:left}

.wish .tag{font-size:12px;border:1px solid var(--sage);padding:0 8px;margin-left:6px;letter-spacing:.1em;border-radius:99px}
.qr{width:180px;margin:12px auto;background:#fff;padding:8px}
.end{padding-bottom:30px}.end .lead{margin:16px auto 6px}
/* ===== preview Google Maps ===== */
.map{position:relative;aspect-ratio:4/3;margin:12px 0 4px;border-radius:8px;overflow:hidden;background:var(--paper-2)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:sepia(.2) saturate(.8)}
/* ===== musik, lightbox, toast ===== */
.music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--green);background:var(--paper);color:var(--green);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px}
.music.show{display:flex}.music.on{animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:20px}
.lightbox.show{display:flex}.lightbox img{max-width:100%;max-height:90vh}
.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-90px);background:var(--green);color:var(--paper);padding:8px 22px;z-index:90;transition:transform .4s;font-size:17px;border-radius:99px}
.toast.show{transform:translate(-50%,0)}
/* ===== animasi ===== */
.rv{opacity:0;translate:0 30px;transition:opacity .9s ease,translate 1s cubic-bezier(.22,1,.36,1)}
.rv.above{translate:0 -30px}.rv.in{opacity:1;translate:0 0}
.w,.wi{display:inline-block}
.rv:not(.in) .w{opacity:0}
.rv.in .w{animation:wordBlur 1.2s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(min(var(--i),16)*90ms)}
.cover .w{animation:wordBlur 1.3s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(min(var(--i),16)*120ms + .25s)}
@keyframes wordBlur{from{opacity:0;transform:translateY(14px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.cover .arch,.rv.in .arch{animation:archUp 1.4s cubic-bezier(.22,1,.36,1) both}
@keyframes archUp{from{opacity:0;clip-path:inset(100% 0 0 0 round 999px 999px 10px 10px)}to{opacity:1;clip-path:inset(0 0 0 0 round 999px 999px 10px 10px)}}
.sprig{animation:sway 6s ease-in-out infinite alternate}@keyframes sway{to{rotate:4deg}}.sprig.s-br{animation-name:swayB}@keyframes swayB{to{rotate:-4deg}}
/* ===== UX ===== */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>

      const fmt = iso => new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: C.timezone }).format(new Date(iso));
      if (/^\d{4}-\d{2}-\d{2}$/.test(tgl) && !isNaN(new Date(tgl))) {
        const iso = tgl + 'T' + String(C.eventISO).split('T')[1];
        if (!isNaN(new Date(iso))) {
          reps.push([fmt(C.eventISO), fmt(iso)]);
          if (C.hashtag) C.hashtag = C.hashtag.split(String(C.eventISO).slice(0, 4)).join(tgl.slice(0, 4));   // #NadiaArya2026 → tahun baru

        if (!v) return;

        if (old) reps.push([old, v], [old.toLowerCase(), v.toLowerCase().replace(/[^a-z0-9]/g, '')]);
        C['name' + k] = v; C['fullName' + k] = v;
      };
      const o1 = C.name1, o2 = C.name2;
      name(1, n1); name(2, n2);
      if (!reps.length) return;
      if (n1 || n2) reps.unshift([`${o1}${o2}`, `${C.name1.split(' ')[0]}${C.name2.split(' ')[0]}`]);   // hashtag #NadiaArya2026 → kata pertama saja (hashtag panjang tidak bisa dipatah & melebarkan halaman)
      const walk = v => typeof v === 'string' ? reps.reduce((s, [a, b]) => a ? s.split(a).join(b) : s, v)
        : Array.isArray(v) ? v.map(walk) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, walk(x)])) : v;

    start(userC) {

      const p = {}; fmt('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).formatToParts(d).forEach(x => p[x.type] = x.value);
      const date = {

      const coords = e => {

      /* ---- BLOK BAKU: isi bagian yang sama di semua tema (tema cukup membungkus + memberi gaya lewat class) ----

        const b = document.createElement('style'); b.id = 'ubase';
        b.textContent = `

      });
      let opened = false;
      $$('[data-open]').forEach(b => { if (b.tagName !== 'BUTTON') b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } }); });
      $$('[data-open]').forEach(b => b.addEventListener('click', () => {
        if (opened) return; opened = true;
        if (cover) {
          cover.classList.add('opened');
          setTimeout(() => { cover.classList.add('hide'); document.body.style.overflow = ''; window.scrollTo(0, 0); startReveal(); }, +(cover.dataset.delay || 0));
        } else startReveal();
        if (has('music') && C.musicURL) audio.play().then(() => music.classList.add('on')).catch(() => {});
        if (has('track') && hasGuest) post({ type: 'open', name: guest });
      }));

      /* hitung mundur */
      const target = d.getTime();
      const tick = () => {
        const t = Math.max(0, target - Date.now());
        const v = { d: Math.floor(t / 864e5), h: Math.floor(t % 864e5 / 36e5), m: Math.floor(t % 36e5 / 6e4), s: Math.floor(t % 6e4 / 1e3) };
        $$('[data-cd]').forEach(el => el.textContent = v[el.dataset.cd]);
      };
      tick(); setInterval(tick, 1000);

      /* salin nomor */
      document.addEventListener('click', async e => {
        const b = e.target.closest('[data-copy]'); if (!b) return;
        try { await navigator.clipboard.writeText(b.dataset.copy); }
        catch { const t = document.createElement('textarea'); t.value = b.dataset.copy; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
        toast('Berhasil disalin ✓');
      });

      /* lightbox: ketuk foto → besar; panah/geser untuk foto berikutnya; Esc/ketuk latar untuk menutup */
      const lb = $('#lb'), lbImg = $('img', lb);
      const pics = $$('[data-src]').filter(g => g.dataset.src);
      let cur = -1, lastFocus = null;
      const lbStyle = document.createElement('style');
      lbStyle.textContent = '.lb-b{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#111;font:700 26px/1 system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}'
        + '.lb-b:focus-visible{outline:3px solid #fff;outline-offset:2px}.lb-p{left:10px}.lb-n{right:10px}'
        + '.lb-x{top:calc(14px + env(safe-area-inset-top));right:10px;transform:none;width:44px;height:44px;font-size:22px}'
        + '.lb-c{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font:14px system-ui,sans-serif;pointer-events:none}';
      document.head.appendChild(lbStyle);
      const mapStyle = document.createElement('style');
      mapStyle.textContent = '.map.sketch{background:transparent}.map.sketch>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;filter:none!important}';
      document.head.appendChild(mapStyle);
      const mk = (cls, label, txt, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'lb-b ' + cls; b.setAttribute('aria-label', label); b.textContent = txt; b.onclick = e => { e.stopPropagation(); fn(); }; lb.appendChild(b); return b; };
      const counter = document.createElement('div'); counter.className = 'lb-c'; lb.appendChild(counter);
      const show = i => {
        cur = (i + pics.length) % pics.length;
        lbImg.src = pics[cur].dataset.src; lbImg.alt = (pics[cur].querySelector('img') || {}).alt || 'Foto galeri';
        lbImg.style.filter = C.photoGrayscale ? 'grayscale(1)' : 'none';
        counter.textContent = pics.length > 1 ? `${cur + 1} / ${pics.length}` : '';
        if (!lb.classList.contains('show')) { lastFocus = document.activeElement; lb.classList.add('show'); }
        xBtn.focus();
      };
      const hide = () => { if (!lb.classList.contains('show')) return; lb.classList.remove('show'); if (lastFocus && lastFocus.focus) lastFocus.focus(); };
      const prevBtn = mk('lb-p', 'Foto sebelumnya', '‹', () => show(cur - 1));
      const nextBtn = mk('lb-n', 'Foto berikutnya', '›', () => show(cur + 1));
      const xBtn = mk('lb-x', 'Tutup', '✕', hide);
      if (pics.length < 2) { prevBtn.style.display = nextBtn.style.display = 'none'; }
      pics.forEach((g, i) => {
        g.tabIndex = 0; g.setAttribute('role', 'button'); g.setAttribute('aria-label', 'Perbesar foto ' + (i + 1));
        g.addEventListener('click', () => show(i));
        g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(i); } });
      });
      lb.onclick = hide;
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('show')) return;
        if (e.key === 'Escape') hide();
        else if (e.key === 'ArrowLeft') show(cur - 1);
        else if (e.key === 'ArrowRight') show(cur + 1);
      });
      let sx = 0;
      lb.addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50 && pics.length > 1) show(cur + (dx < 0 ? 1 : -1)); }, { passive: true });

      /* RSVP + ucapan */
      const form = $('[data-rsvp]');
      if (form) {
        const val = n => ((form.elements[n] && form.elements[n].value) || '').trim();
        const wa = () => {
          if (!C.rsvpPhone) return toast('Nomor WhatsApp belum diatur');
          const v = { tamu: val('fn') || guest, status: val('st'), jumlah: val('fj'), ucapan: val('fm') || '-' };
          const m = C.rsvpMessage.replace(/\{(tamu|status|jumlah|ucapan)\}/g, (_, k) => v[k]);   // fungsi, bukan string: ucapan berisi $& tidak merusak pesan
          window.open(`https://wa.me/${C.rsvpPhone}?text=${encodeURIComponent(m)}`, '_blank');
        };
        $$('[data-act=wa]', form).forEach(b => b.addEventListener('click', wa));

        if (has('wishes')) {
          const KEY = 'wishes:' + slug;
          const local = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
          let remote = [];
          const box = $('[data-wishes]');
          const render = () => {
            if (!box) return;
            const list = (endpoint ? remote : local()).slice().sort((a, b) => (b.time || 0) - (a.time || 0));
            box.innerHTML = '';
            if (!list.length) { box.innerHTML = '<p style="text-align:center">Jadilah yang pertama memberi ucapan ♥</p>'; return; }
            list.forEach(w => {
              const row = document.createElement('div'); row.className = 'wish';
              const b = document.createElement('b'); b.textContent = w.name;
              const t = document.createElement('span'); t.className = 'tag'; t.textContent = w.status;
              const m = document.createElement('p'); m.textContent = w.message;
              row.append(b, t, m); box.appendChild(row);
            });
          };
          if (endpoint) fetch(`${endpoint}?type=wishes&slug=${encodeURIComponent(slug)}`).then(r => r.json()).then(j => { remote = Array.isArray(j) ? j : []; render(); }).catch(() => {});
          render();
          /* anti-bot: kolom jebakan tak terlihat (manusia tak mengisinya) + jeda antar kiriman */
          const trap = document.createElement('input');
          trap.type = 'text'; trap.name = 'website'; trap.tabIndex = -1; trap.autocomplete = 'off'; trap.setAttribute('aria-hidden', 'true');
          trap.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;opacity:0';
          form.appendChild(trap);
          let lastSend = 0;
          /* ID acak per perangkat: kirim ulang dari perangkat yang sama MEMPERBARUI konfirmasi lama (tidak dobel) */
          const rid = (() => { try { let r = localStorage.getItem('rid:' + slug); if (!r) { r = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('rid:' + slug, r); } return r; } catch { return Math.random().toString(36).slice(2); } })();
          form.addEventListener('submit', e => {
            e.preventDefault();
            const w = { name: val('fn'), status: val('st'), jumlah: val('fj'), message: val('fm'), time: Date.now() };
            if (!w.name) return;
            if (trap.value) return;                                   // bot
            if (Date.now() - lastSend < 15000) return toast('Sebentar ya, baru saja terkirim');
            lastSend = Date.now();
            if (endpoint) { post(Object.assign({ type: 'rsvp', rid }, w)); if (w.message) remote = [Object.assign({ mine: true }, w)].concat(remote.filter(x => !x.mine)); }
            else try { localStorage.setItem(KEY, JSON.stringify([w].concat(local()))); } catch {}
            render(); const m = form.elements['fm']; if (m) m.value = ''; toast('Terkirim, terima kasih ♥');
          });
        } else {
          form.addEventListener('submit', e => { e.preventDefault(); wa(); });
        }
      }

      /* QR check-in (premium) */
      const qrBox = $('[data-qr]');
      if (qrBox && has('qr') && hasGuest) {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
        s.onload = () => { const q = qrcode(0, 'M'); q.addData(`U1|${slug}|${guest}`); q.make(); qrBox.innerHTML = q.createSvgTag({ scalable: true, margin: 2 }); };
        document.head.appendChild(s);
      }

      /* animasi masuk & keluar saat scroll, DUA ARAH:
         scroll turun → elemen naik dari bawah; scroll naik → elemen turun dari atas.
         Dimulai setelah cover dibuka. Menghormati pengaturan "reduce motion". */
      let revealStarted = false;
      function startReveal() {
        if (revealStarted) return; revealStarted = true;
        const items = $$('.rv');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { items.forEach(el => el.classList.add('in')); return; }
        const io = new IntersectionObserver(es => es.forEach(x => {
          const el = x.target;
          if (x.isIntersecting) { el.classList.remove('above'); el.classList.add('in'); }
          else { el.classList.remove('in'); el.classList.toggle('above', x.boundingClientRect.top < innerHeight / 2); }
        }), { threshold: 0.05, rootMargin: '-8% 0px -8% 0px' });
        items.forEach(el => io.observe(el));
      }
      if (!cover) startReveal();
    }
  };
  window.Undangan = Undangan;
})();

</script>
<script>
/* TEMA SAGE GARDEN — kertas krem, bingkai lengkung, ranting garis, selang-seling panel krem & hijau sage, galeri 1 besar + 2 kecil */
Undangan.register('sage', {
  render(C, H) {
    const { esc, has, date, cal } = H;
    H.setVar('--green', C.colorMain);
    const names = H.names;

    /* ilustrasi: pakai gambar sendiri (illustrationURL) atau sketsa bawaan */
    const faceG = C.face2 || C.photo2, faceB = C.face1 || C.photo1;   // face1/face2 = potongan wajah untuk ilustrasi
    const illus = uid => C.illustrationURL
      ? `<img class="illus" src="${esc(C.illustrationURL)}" alt="${esc(names)}">`
      : `<svg class="illus" viewBox="0 0 300 300">
  <defs><clipPath id="cg${uid}"><circle cx="112" cy="52" r="30"/></clipPath><clipPath id="cb${uid}"><circle cx="196" cy="68" r="27"/></clipPath></defs>
  <circle cx="112" cy="52" r="30" fill="#ddd5c2" stroke="#58704f" stroke-width="1.5" ${faceG ? 'style="display:none"' : ''}/>
  <circle cx="196" cy="68" r="27" fill="#ddd5c2" stroke="#58704f" stroke-width="1.5" ${faceB ? 'style="display:none"' : ''}/>
  ${faceG ? `<image clip-path="url(#cg${uid})" href="${esc(faceG)}" x="82" y="22" width="60" height="60" preserveAspectRatio="xMidYMid slice"/>` : ''}
  ${faceB ? `<image clip-path="url(#cb${uid})" href="${esc(faceB)}" x="169" y="41" width="54" height="54" preserveAspectRatio="xMidYMid slice"/>` : ''}
  <g class="ln"><path d="M76 100 C90 86 130 84 148 96"/><path d="M78 102 C70 130 76 168 80 196"/><path d="M146 98 C150 140 150 170 146 196"/><path d="M112 86 L112 190"/><path d="M104 88 L112 104 L122 88"/><path d="M80 196 L82 262 L110 262 L112 196"/><path d="M114 196 L118 262 L146 262 L146 198"/><path d="M72 262 C70 276 78 282 96 280 L110 278 L110 264"/><path d="M118 264 L118 278 L146 280 C160 280 168 274 150 262"/><path d="M92 94 C80 98 70 96 66 90"/></g>
  <g class="ln"><path d="M10 120 C30 108 70 112 110 126 C140 136 160 142 176 130"/><path d="M10 120 C26 150 40 176 70 186 C100 198 140 200 168 176"/><path d="M176 130 C190 118 206 108 214 96"/><path d="M176 130 L172 168"/><path d="M214 96 C226 80 238 66 252 56"/><path d="M222 100 C238 84 252 74 262 62"/><path d="M172 168 C178 180 184 186 192 190 L196 156"/><path d="M150 168 C146 178 142 186 136 192"/></g>
  <g class="ln"><path d="M248 52 C238 38 256 24 270 32 C284 26 296 40 286 52 C294 64 280 74 268 66 C258 76 242 66 248 52Z"/><path d="M260 40 C266 34 276 38 274 46 C282 48 280 58 270 56 C264 62 256 56 260 50"/></g></svg>`;

    const leaf = `<svg class="leaf" viewBox="0 0 120 24" aria-hidden="true"><use href="#leafSym"/></svg>`;
    const wd = (date.long || '').split(',')[0];
    const evMini = C.events.map(e => `<div class="ev"><h3>${esc(e.title)}</h3><div class="time">${esc(e.timeText)}</div></div>`).join('');
    const sec = (inner, cls = '') => `<section class="sec ${cls} rv">${inner}</section>`;
    const head = (t, sub) => `${leaf}<h2 class="script title">${t}</h2>${sub ? `<p class="eyebrow">${sub}</p>` : ''}`;

    /* ---------- cover: bingkai lengkung di kertas krem, ranting di sudut ---------- */
    let h = `
    <section class="cover" data-cover>
      <svg class="sprig s-tl" viewBox="0 0 160 220"><use href="#sprigSym"/></svg>
      <svg class="sprig s-br" viewBox="0 0 160 220"><use href="#sprigSym"/></svg>
      <div class="cv">
        <p class="eyebrow">${esc(C.coverText)}</p>
        <div class="arch">${illus('c')}</div>
        <h1 class="script names">${esc(names)}</h1>
        <p class="cdate">${esc(date.dmySpaced)}</p>
        <div class="guest"><p class="to">Kepada Yth.</p><p class="nm" data-guest></p></div>
        <button class="btn" data-open>${esc(C.openButton)}</button>
      </div>
    </section>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <symbol id="sprigSym" viewBox="0 0 160 220"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <path d="M10 215 C40 150 60 100 100 20"/><path d="M45 150 C70 140 90 120 120 112"/><path d="M62 118 C50 100 40 90 24 84"/><path d="M80 70 C100 66 118 50 140 44"/>
        <path d="M100 20 c-10 4-14 14-10 22 c8-2 14-12 10-22Z"/><path d="M120 112 c-12-2-20 6-20 14 c10 2 18-6 20-14Z"/><path d="M24 84 c2 12 12 18 20 16 c0-10-10-18-20-16Z"/>
        <path d="M140 44 c-12 0-18 10-16 18 c10 0 18-8 16-18Z"/><path d="M78 96 c-8 6-8 16-2 20 c6-6 8-14 2-20Z"/><path d="M58 132 c-10 2-14 12-10 18 c8-2 12-10 10-18Z"/></g></symbol>
      <symbol id="leafSym" viewBox="0 0 120 24"><g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
        <path d="M6 12 H50"/><path d="M70 12 H114"/><circle cx="60" cy="12" r="3"/>
        <path d="M50 12 c-6-8-14-8-18-4 c6 6 12 6 18 4Z"/><path d="M70 12 c6-8 14-8 18-4 c-6 6-12 6-18 4Z"/>
        <path d="M40 12 c-4 6-10 8-14 6 c4-6 10-8 14-6Z"/><path d="M80 12 c4 6 10 8 14 6 c-4-6-10-8-14-6Z"/></g></symbol>
    </defs></svg>
    <main class="stack">`;

    /* ---------- pembuka: ilustrasi dalam lengkung + blok tanggal ---------- */
    h += sec(`<p class="eyebrow">${esc(C.coverText)}</p><div class="arch big">${illus('m')}</div>
      <h1 class="script names">${esc(names)}</h1>
      <p class="lead">${esc(C.tagline || '')}</p>
      <div class="dblock"><span>${esc(wd)}</span><b>${cal.day}</b><span>${esc(cal.monthName)}<br>${cal.year}</span></div>
      <div class="events">${evMini}</div>`, 'hero');

    /* ---------- hitung mundur (panel hijau) ---------- */
    h += sec(`<p class="eyebrow">Menuju Hari Bahagia</p>
      <div class="count"><div><b data-cd="d">0</b><span>Hari</span></div><div><b data-cd="h">0</b><span>Jam</span></div><div><b data-cd="m">0</b><span>Menit</span></div><div><b data-cd="s">0</b><span>Detik</span></div></div>
      <a class="btn ghost sm" href="${H.gcal}" target="_blank" rel="noopener">+ Simpan ke Kalender</a>`, 'band');

    /* ---------- ayat ---------- */
    if (has('quote') && C.quote && C.quote.text) h += sec(`<div class="quote"><span class="qm">“</span><p class="lead">${esc(C.quote.text)}</p><p class="eyebrow">${esc(C.quote.source)}</p></div>`);

    /* ---------- mempelai ---------- */
    if (has('couple')) {
      const person = (full, par, ig, ph) => `<div class="person">${ph ? `<div class="pic"><img src="${esc(ph)}" alt="${esc(full)}" loading="lazy"></div>` : ''}<h3>${esc(full)}</h3><p class="small">${esc(par)}</p>${ig ? `<p class="small"><a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a></p>` : ''}</div>`;
      h += sec(`${head('Mempelai', 'Dengan memohon rahmat Tuhan')}${person(C.fullName1, C.parents1, C.instagram1, C.photo1)}<p class="script amp">&amp;</p>${person(C.fullName2, C.parents2, C.instagram2, C.photo2)}`);
    }

    /* ---------- acara (panel hijau, kartu krem) ---------- */
    if (has('events')) {
      h += sec(`${head('Detail Acara')}` + C.events.map(e => `<div class="ev card"><h3>${esc(e.title)}</h3>
        ${e.dateText ? `<div class="small">${esc(e.dateText)}</div>` : ''}<div class="time">${esc(e.timeText)}</div>
        <div class="place"><b>${esc(e.venue)}</b><br>${esc(e.address)}</div>
        ${H.mapBox(e)}
        ${e.mapsURL ? `<a class="btn sm" href="${esc(e.mapsURL)}" target="_blank" rel="noopener">Lihat Lokasi</a>` : ''}</div>`).join('') +
        (has('livestream') && C.livestreamURL ? `<a class="btn ghost sm" href="${esc(C.livestreamURL)}" target="_blank" rel="noopener">▶ Live Streaming</a>` : ''), 'band');
    }

    /* ---------- love story ---------- */
    if (has('story') && C.story.length) h += sec(`${head('Kisah Kami')}<div class="tl">` +
      C.story.map(s => `<div class="it"><div class="yr">${esc(s.date)}</div><div class="tt">${esc(s.title)}</div><p class="small">${esc(s.text)}</p></div>`).join('') + `</div>`);

    /* ---------- info penting ---------- */
    if (has('details') && C.details.length) h += sec(`${head('Info Penting')}<div class="dets">` +
      C.details.map(x => `<div class="det"><b>${esc(x.h)}</b><span class="small">${esc(x.t)}</span></div>`).join('') + `</div>`);

    /* ---------- galeri: pola 1 besar + 2 kecil ---------- */
    if (has('gallery') && H.gal.length) h += sec(`${head('Galeri', 'Momen kami')}<div class="gallery">` +
      H.gal.map(g => `<div class="g" data-src="${esc(g)}">${H.img(g, 'Galeri')}</div>`).join('') + `</div>`);

    /* ---------- video ---------- */
    if (has('video') && H.ytEmbed(C.videoURL)) h += sec(`${head('Video')}<div class="vid"><iframe src="${H.ytEmbed(C.videoURL)}" allowfullscreen loading="lazy"></iframe></div>`);

    /* ---------- amplop digital (panel hijau) ---------- */
    if (has('gift') && (C.banks.length || C.giftAddress)) h += sec(`${head('Tanda Kasih')}<p class="small">${esc(C.giftIntro)}</p>` +
      C.banks.map(b => `<div class="bank card"><span class="eyebrow">${esc(b.bank)}</span><strong>${esc(b.number)}</strong><span class="small">a.n. ${esc(b.name)}</span><button class="btn sm" data-copy="${esc(b.number)}">Salin Nomor</button></div>`).join('') +
      (C.giftAddress ? `<div class="bank card"><span class="eyebrow">Kirim Kado</span><span class="small">${esc(C.giftAddress)}</span><button class="btn sm" data-copy="${esc(C.giftAddress)}">Salin Alamat</button></div>` : ''), 'band');

    /* ---------- RSVP / ucapan ---------- */
    if (has('rsvp')) {
      const w = has('wishes');
      h += sec(`${head('Konfirmasi Kehadiran')}${C.rsvpNote ? `<p class="small">${esc(C.rsvpNote)}</p>` : ''}
      <form data-rsvp>
        <div><label>Nama</label><input name="fn" required value="${H.hasGuest ? esc(H.guest) : ''}"></div>
        <div><label>Kehadiran</label><select name="st">${C.rsvpOptions.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>
        <div><label>Jumlah Tamu</label><select name="fj">${[1, 2, 3, 4, 5].map(n => `<option>${n}</option>`).join('')}</select></div>
        <div><label>Ucapan &amp; Doa</label><textarea name="fm" rows="3"></textarea></div>
        ${w ? `<button class="btn" type="submit">Kirim Konfirmasi</button>` : ''}
        ${C.rsvpPhone ? `<button class="btn ${w ? 'ghost' : ''}" type="${w ? 'button' : 'submit'}" data-act="wa">Kirim via WhatsApp</button>` : ''}
      </form>${w ? `<div class="wishes" data-wishes></div>` : ''}`);
    }

    /* ---------- QR ---------- */
    if (has('qr') && H.hasGuest) h += sec(`${head('QR Tamu')}<p class="small">Tunjukkan QR ini kepada penerima tamu saat tiba.</p><div class="qr" data-qr></div><p class="small"><b>${esc(H.guest)}</b></p>`);

    /* ---------- penutup ---------- */
    h += sec(`<div class="arch sm">${illus('e')}</div><p class="lead">${esc(C.closingText)}</p>${leaf}<p class="script names">${esc(names)}</p>${C.hashtag ? `<p class="eyebrow">${esc(C.hashtag)}</p>` : ''}`, 'end') + `</main>`;
    return h;
  },

  /* Elegan: kata muncul satu per satu dari blur halus (diatur di theme.css) */
  after(root) {
    Undangan.splitWords(root,
      '.names, .eyebrow, .guest .to, .guest .nm, .lead, .cdate, .title, .amp, .ev h3, .ev .time, .ev .place, .ev .small, ' +
      '.person h3, .person .small, .tl .yr, .tl .tt, .tl .small, .det b, .det .small, .bank strong, p.small, .script',
      el => el.closest('form') || el.closest('.count') || el.closest('button') || el.closest('a'));
  }
});

</script>
