<script>
/* =====================================================================
   ENGINE UNDANGAN DIGITAL  —  logika bersama untuk semua tema
   Tema hanya bertugas menggambar HTML (render) + CSS.
   Engine mengurus: paket/fitur, nama tamu, hitung mundur, kalender,
   RSVP, ucapan, amplop digital, galeri, musik, QR, pelacakan, masa aktif.
===================================================================== */
(function () {
  /* ---------------- PAKET & FITUR ---------------- */
  const BASIC = ['quote', 'couple', 'events', 'gallery', 'rsvp'];
  const STANDAR = BASIC.concat(['details', 'story', 'gift', 'wishes', 'music', 'map', 'track']);
  const PREMIUM = STANDAR.concat(['livestream', 'video', 'qr']);
  const PACKAGES = {
    basic:   { label: 'Basic',   features: BASIC,   galleryMax: 4 },
    standar: { label: 'Standar', features: STANDAR, galleryMax: 12 },
    premium: { label: 'Premium', features: PREMIUM, galleryMax: 30 }
  };

  const DEFAULTS = {
    package: 'basic',
    guestDefault: 'Tamu Undangan',
    timezone: 'Asia/Jakarta',
    eventDurationHours: 4,
    sections: {},
    events: [], story: [], gallery: [], details: [], banks: [],
    rsvpOptions: ['Hadir', 'Tidak Hadir', 'Masih Ragu'],
    rsvpMessage: 'Halo, saya {tamu}. Konfirmasi: {status}, jumlah {jumlah} orang. Ucapan: {ucapan}',
    giftIntro: 'Doa restu Anda adalah hadiah terindah. Namun bila ingin mengirimkan tanda kasih, dapat melalui:',
    closingText: 'Merupakan kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.',
    hashtag: '',
    coverText: 'Undangan Pernikahan',
    openButton: 'Buka Undangan',
    coverHint: 'Ketuk amplop untuk membuka',
    expiredText: 'Masa aktif undangan ini telah berakhir. Terima kasih atas doa dan kehadirannya.',
    photoGrayscale: false
  };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ZONE = { 'Asia/Jakarta': 'WIB', 'Asia/Makassar': 'WITA', 'Asia/Jayapura': 'WIT' };

  const Undangan = {
    packages: PACKAGES,
    themes: {},
    register(name, theme) { this.themes[name] = theme; },

    /* Pecah teks elemen (yang cocok dengan selector) menjadi kata:
       <span class="w" style="--i:n;--r:±deg"><span class="wi">kata</span></span>
       Dipakai tema untuk animasi kata. `skip(el)` → true bila elemen dilewati. */
    splitWords(root, sel, skip) {
      root.querySelectorAll(sel).forEach(el => {
        if (el.querySelector('.w') || el.closest('.w') || (skip && skip(el))) return;
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        let i = 0;
        nodes.forEach(n => {
          if (!n.textContent.trim()) return;
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(part => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.append(' '); return; }
            const w = document.createElement('span'); w.className = 'w';
            w.style.setProperty('--i', i);
            w.style.setProperty('--r', ((i % 2 ? 1 : -1) * (1 + (i % 3) * .6)).toFixed(1) + 'deg');
            const inner = document.createElement('span'); inner.className = 'wi'; inner.textContent = part;
            w.append(inner); frag.append(w); i++;
          });
          n.replaceWith(frag);
        });
      });
    },

    start(userC) {
      const C = Object.assign({}, DEFAULTS, userC);
      const root = document.getElementById('u-root');
      const slug = C.slug || window.__SLUG || 'undangan';
      const P = PACKAGES[C.package] || PACKAGES.basic;
      /* add-on: fitur di luar paket yang dibeli terpisah → addons: ['music','map','qr', ...]
         tambahan foto galeri → galleryExtra: 8 */
      const addons = C.addons || [];
      const has = k => (P.features.includes(k) || addons.includes(k)) && C.sections[k] !== false;
      const params = new URLSearchParams(location.search);
      const hasGuest = !!(params.get('to') || '').trim();
      const guest = (params.get('to') || C.guestDefault).trim().slice(0, 60);
      const endpoint = C.endpoint || '';
      const names = C.coupleNames || `${C.name1} & ${C.name2}`;
      document.title = `Undangan Pernikahan ${names}`;

      /* ---- masa aktif ---- */
      if (C.activeUntil && Date.now() > new Date(C.activeUntil).getTime()) {
        root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;font:20px/1.4 Georgia,serif;color:#444"><div><h1 style="font-size:34px;margin-bottom:12px">${esc(names)}</h1><p>${esc(C.expiredText)}</p></div></div>`;
        return;
      }

      /* ---- tanggal & jam (otomatis dari eventISO) ---- */
      const d = new Date(C.eventISO), tz = C.timezone;
      const fmt = (loc, o) => new Intl.DateTimeFormat(loc, Object.assign({ timeZone: tz }, o));
      const p = {}; fmt('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).formatToParts(d).forEach(x => p[x.type] = x.value);
      const date = {
        long: fmt('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d),
        dmySpaced: `${p.day} . ${p.month} . ${p.year}`,
        dmyDots: `${p.day}.${p.month}.${p.year}`,
        time: fmt('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }).format(d).replace(':', '.') + ' ' + (ZONE[tz] || '')
      };

      /* kalender bulan acara (untuk tema yang menampilkan kalender): minggu dimulai Senin */
      const cal = (() => {
        const y = +p.year, m = +p.month, day = +p.day;
        return { year: y, month: m, day, monthName: new Intl.DateTimeFormat('id-ID', { month: 'long', timeZone: 'UTC' }).format(new Date(Date.UTC(y, m - 1, 1))),
          daysInMonth: new Date(Date.UTC(y, m, 0)).getUTCDate(), offset: (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7,
          dow: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'] };
      })();

      /* ---- galeri sesuai paket ---- */
      let gal = (C.gallery || []).slice(0, P.galleryMax + (+C.galleryExtra || 0));
      if (!C.demo) gal = gal.filter(Boolean);

      /* ---- kalender ---- */
      const f = x => x.toISOString().replace(/[-:]|\.\d{3}/g, '');
      const en = new Date(d.getTime() + C.eventDurationHours * 36e5);
      const gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent('Pernikahan ' + names)
        + '&dates=' + f(d) + '/' + f(en)
        + '&location=' + encodeURIComponent((C.events[0] && (C.events[0].venue || C.events[0].place) + ', ' + C.events[0].address) || '');

      const ytEmbed = u => { const m = String(u || '').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/); return m ? 'https://www.youtube.com/embed/' + m[1] : ''; };
      /* preview Google Maps (iframe, tanpa API key). Isi `mapQuery` di acara bila ingin pencarian yang lebih tepat. */
      /* Urutan pilihan peta per acara (semua dikunci paket/add-on "map"):
         1. mapImage  = gambar peta sederhana (SVG/PNG/WebP) → dibuat dengan tools/map-sketch.js atau AI. Paling rapi & ringan, tanpa Google.
         2. lat+lng   = embed Google Maps tepat di titik itu dengan zoom (mapZoom, default 17). Koordinat juga dibaca otomatis dari mapsURL
                        bila memuat "@lat,lng" / "!3d..!4d.." / "q=lat,lng".
         3. mapQuery / venue+alamat = pencarian teks (bisa meleset sampai tampil satu pulau → lebih baik pakai 1 atau 2). */
      const coords = e => {
        if (isFinite(e.lat) && isFinite(e.lng) && e.lat !== '' && e.lng !== '' && e.lat != null) return [+e.lat, +e.lng];
        const u = String(e.mapsURL || ''), m = u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || u.match(/[?&](?:q|ll|query)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/);
        return m ? [+m[1], +m[2]] : null;
      };
      const mapSrc = e => {
        if (!has('map') || e.mapEmbed === false || e.mapImage) return '';
        const c = coords(e);
        if (c) return `https://maps.google.com/maps?q=${c[0]},${c[1]}&z=${+e.mapZoom || 17}&output=embed`;
        const q = e.mapQuery || [e.venue || e.place, e.address].filter(Boolean).join(', ');
        return q ? 'https://maps.google.com/maps?q=' + encodeURIComponent(q) + '&output=embed' : '';
      };
      const mapBox = e => {
        if (has('map') && e.mapEmbed !== false && e.mapImage) return `<div class="map sketch"><img src="${esc(e.mapImage)}" alt="Peta lokasi ${esc(e.venue || e.place || '')}" loading="lazy"></div>`;
        return mapSrc(e) ? `<div class="map"><iframe src="${esc(mapSrc(e))}" title="Peta ${esc(e.venue || e.place || '')}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>` : '';

      const img = (src, alt, cls) => src ? `<img class="${cls || ''}" src="${esc(src)}" alt="${esc(alt || '')}" loading="lazy">` : `<div class="ph">Foto</div>`;

      const H = {

      /* nama tamu diisi SEBELUM tema memproses teks (mis. memecah jadi kata) */
      $$('[data-guest]').forEach(el => el.textContent = guest);
      if (theme.base) {
        const b = document.createElement('style'); b.id = 'ubase';
        b.textContent = `

        document.head.insertBefore(b, document.head.firstChild);
      }
      if (theme.after) theme.after(root, C, H);

      /* ---------------- perilaku ---------------- */
      const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); };
      const post = o => endpoint && fetch(endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ slug }, o)) }).catch(() => {});

      /* buka cover */

      music.onclick = () => {

      };
      /* hemat baterai/kuota: jeda musik saat tab disembunyikan, lanjut bila tadinya menyala */
      let resume = false;
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { resume = !audio.paused; audio.pause(); }
        else if (resume) { resume = false; audio.play().catch(() => {}); }
      });
      let opened = false;
      $$('[data-open]').forEach(b => { if (b.tagName !== 'BUTTON') b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } }); });
      $$('[data-open]').forEach(b => b.addEventListener('click', () => {

      }));

        document.head.appendChild(s);
      }

      /* animasi masuk & keluar saat scroll, DUA ARAH:
         scroll turun → elemen naik dari bawah; scroll naik → elemen turun dari atas.
         Dimulai setelah cover dibuka. Menghormati pengaturan "reduce motion". */
      let revealStarted = false;
      function startReveal() {
        if (revealStarted) return; revealStarted = true;
        const items = $$('.rv');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { items.forEach(el => el.classList.add('in')); return; }
        const io = new IntersectionObserver(es => es.forEach(x => {
          const el = x.target;
          if (x.isIntersecting) { el.classList.remove('above'); el.classList.add('in'); }
          else { el.classList.remove('in'); el.classList.toggle('above', x.boundingClientRect.top < innerHeight / 2); }
        }), { threshold: 0.05, rootMargin: '-8% 0px -8% 0px' });
        items.forEach(el => io.observe(el));
      }
      if (!cover) startReveal();
    }
  };
  window.Undangan = Undangan;
})();

</script>
<script>
/* TEMA SAGE — kertas krem + garis hijau (terinspirasi referensi) */
Undangan.register('sage', {
  render(C, H) {
    const { esc, has, date } = H;
    H.setVar('--green', C.colorMain);
    const names = H.names;

    /* ilustrasi: pakai gambar sendiri (illustrationURL) atau sketsa bawaan */
    const faceG = C.face2 || C.photo2, faceB = C.face1 || C.photo1;   // face1/face2 = potongan wajah untuk ilustrasi
    const illus = uid => C.illustrationURL
      ? `<img class="illus" src="${esc(C.illustrationURL)}" alt="${esc(names)}">`
      : `<svg class="illus" viewBox="0 0 300 300">
  <defs><clipPath id="cg${uid}"><circle cx="112" cy="52" r="30"/></clipPath><clipPath id="cb${uid}"><circle cx="196" cy="68" r="27"/></clipPath></defs>
  <circle cx="112" cy="52" r="30" fill="#ddd5c2" stroke="#58704f" stroke-width="1.5" ${faceG ? 'style="display:none"' : ''}/>
  <circle cx="196" cy="68" r="27" fill="#ddd5c2" stroke="#58704f" stroke-width="1.5" ${faceB ? 'style="display:none"' : ''}/>
  ${faceG ? `<image clip-path="url(#cg${uid})" href="${esc(faceG)}" x="82" y="22" width="60" height="60" preserveAspectRatio="xMidYMid slice"/>` : ''}
  ${faceB ? `<image clip-path="url(#cb${uid})" href="${esc(faceB)}" x="169" y="41" width="54" height="54" preserveAspectRatio="xMidYMid slice"/>` : ''}
  <g class="ln"><path d="M76 100 C90 86 130 84 148 96"/><path d="M78 102 C70 130 76 168 80 196"/><path d="M146 98 C150 140 150 170 146 196"/><path d="M112 86 L112 190"/><path d="M104 88 L112 104 L122 88"/><path d="M80 196 L82 262 L110 262 L112 196"/><path d="M114 196 L118 262 L146 262 L146 198"/><path d="M72 262 C70 276 78 282 96 280 L110 278 L110 264"/><path d="M118 264 L118 278 L146 280 C160 280 168 274 150 262"/><path d="M92 94 C80 98 70 96 66 90"/></g>
  <g class="ln"><path d="M10 120 C30 108 70 112 110 126 C140 136 160 142 176 130"/><path d="M10 120 C26 150 40 176 70 186 C100 198 140 200 168 176"/><path d="M176 130 C190 118 206 108 214 96"/><path d="M176 130 L172 168"/><path d="M214 96 C226 80 238 66 252 56"/><path d="M222 100 C238 84 252 74 262 62"/><path d="M172 168 C178 180 184 186 192 190 L196 156"/><path d="M150 168 C146 178 142 186 136 192"/></g>
  <g class="ln"><path d="M248 52 C238 38 256 24 270 32 C284 26 296 40 286 52 C294 64 280 74 268 66 C258 76 242 66 248 52Z"/><path d="M260 40 C266 34 276 38 274 46 C282 48 280 58 270 56 C264 62 256 56 260 50"/></g></svg>`;

    const evMini = C.events.map(e => `<div class="ev"><h3>${esc(e.title)}</h3><div class="time">${esc(e.timeText)}</div></div>`).join('');

    /* ---------- cover ---------- */
    let h = `
    <section class="cover" data-cover>
      <div class="silk"></div>
      <div class="card">
        <p class="eyebrow">${esc(C.coverText)}</p>
        ${illus('c')}
        <h1 class="script names">${esc(names)}</h1>
        <div class="guest"><p class="to">Kepada Yth.</p><p class="nm" data-guest></p></div>
        <button class="btn" data-open>${esc(C.openButton)}</button>
      </div>
    </section>
    <div class="silk fixed"></div>
    <svg class="sprig tl" viewBox="0 0 160 220"><use href="#sprigSym"/></svg>
    <svg class="sprig br" viewBox="0 0 160 220"><use href="#sprigSym"/></svg>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="sprigSym" viewBox="0 0 160 220">
      <g fill="none" stroke="#a08a6c" stroke-width="1.2" stroke-linecap="round"><path d="M10 215 C40 150 60 100 100 20"/><path d="M45 150 C70 140 90 120 120 112"/><path d="M62 118 C50 100 40 90 24 84"/><path d="M80 70 C100 66 118 50 140 44"/></g>
      <g fill="#fbf8f1" stroke="#d9cfbd" stroke-width=".8"><circle cx="100" cy="20" r="6"/><circle cx="90" cy="30" r="4"/><circle cx="110" cy="32" r="4"/><circle cx="120" cy="112" r="6"/><circle cx="130" cy="104" r="4"/><circle cx="112" cy="122" r="4"/><circle cx="24" cy="84" r="6"/><circle cx="14" cy="90" r="4"/><circle cx="32" cy="94" r="4"/><circle cx="140" cy="44" r="6"/><circle cx="148" cy="54" r="4"/><circle cx="132" cy="36" r="4"/><circle cx="70" cy="86" r="4"/><circle cx="56" cy="130" r="4"/><circle cx="78" cy="60" r="4"/></g></symbol></defs></svg>
    <main class="stack">`;

    /* ---------- kartu utama ---------- */
    h += `<section class="card rv">${illus('m')}
      <h1 class="script names">${esc(names)}</h1>
      <p class="lead">${esc(C.tagline || '')}</p>
      <p class="date">${esc(C.dateDisplay || date.dmySpaced)}</p>
      <div class="events">${evMini}</div>
      ${C.rsvpNote ? `<p class="small" style="margin-top:20px">${esc(C.rsvpNote)}</p>` : ''}
    </section>`;

    /* ---------- hitung mundur ---------- */
    h += `<section class="card rv"><p class="eyebrow">Menuju Hari Bahagia</p>
      <div class="count"><div><b data-cd="d">0</b><span>Hari</span></div><div><b data-cd="h">0</b><span>Jam</span></div><div><b data-cd="m">0</b><span>Menit</span></div><div><b data-cd="s">0</b><span>Detik</span></div></div>
      <div class="divider"></div><a class="btn ghost sm" href="${H.gcal}" target="_blank" rel="noopener">Simpan ke Kalender</a></section>`;

    /* ---------- ayat ---------- */
    if (has('quote') && C.quote && C.quote.text) h += `<section class="card rv"><p class="lead" style="font-style:italic">“${esc(C.quote.text)}”</p><p class="small" style="margin-top:10px">${esc(C.quote.source)}</p></section>`;

    /* ---------- mempelai ---------- */
    if (has('couple')) {
      const person = (full, par, ig, ph) => `<div class="person">${ph ? `<div class="pic"><img src="${esc(ph)}" alt="${esc(full)}" loading="lazy"></div>` : ''}<h3>${esc(full)}</h3><p class="small">${esc(par)}</p>${ig ? `<p class="small"><a href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a></p>` : ''}</div>`;
      h += `<section class="card rv"><h2 class="script title">Mempelai</h2>${person(C.fullName1, C.parents1, C.instagram1, C.photo1)}<div class="divider"></div>${person(C.fullName2, C.parents2, C.instagram2, C.photo2)}</section>`;
    }

    /* ---------- acara ---------- */
    if (has('events')) {
      h += `<section class="card rv"><h2 class="script title">Detail Acara</h2>` + C.events.map((e, i) => `
        ${i ? '<div class="divider"></div>' : ''}<div class="ev"><h3>${esc(e.title)}</h3>
        ${e.dateText ? `<div class="small">${esc(e.dateText)}</div>` : ''}<div class="time">${esc(e.timeText)}</div>
        <div class="place"><b>${esc(e.venue)}</b><br>${esc(e.address)}</div>
        ${H.mapBox(e)}
        ${e.mapsURL ? `<a class="btn ghost sm" href="${esc(e.mapsURL)}" target="_blank" rel="noopener">Lihat Lokasi</a>` : ''}</div>`).join('');
      if (has('livestream') && C.livestreamURL) h += `<div class="divider"></div><a class="btn sm" href="${esc(C.livestreamURL)}" target="_blank" rel="noopener">▶ Live Streaming</a>`;
      h += `</section>`;
    }

    /* ---------- love story ---------- */
    if (has('story') && C.story.length) h += `<section class="card rv"><h2 class="script title">Kisah Kami</h2><div class="tl">` +
      C.story.map(s => `<div class="it"><div class="yr">${esc(s.date)}</div><div class="tt">${esc(s.title)}</div><p class="small">${esc(s.text)}</p></div>`).join('') + `</div></section>`;

    /* ---------- info penting ---------- */
    if (has('details') && C.details.length) h += `<section class="card rv"><h2 class="script title">Info Penting</h2>` +
      C.details.map(x => `<div class="det"><b>${esc(x.h)}</b><span class="small">${esc(x.t)}</span></div>`).join('') + `</section>`;

    /* ---------- galeri ---------- */
    if (has('gallery') && H.gal.length) h += `<section class="card rv"><h2 class="script title">Galeri</h2><div class="gallery">` +
      H.gal.map(g => `<div class="g" data-src="${esc(g)}">${H.img(g, 'Galeri')}</div>`).join('') + `</div></section>`;

    /* ---------- video ---------- */
    if (has('video') && H.ytEmbed(C.videoURL)) h += `<section class="card rv"><h2 class="script title">Video</h2><div class="vid"><iframe src="${H.ytEmbed(C.videoURL)}" allowfullscreen loading="lazy"></iframe></div></section>`;

    /* ---------- amplop digital ---------- */
    if (has('gift') && (C.banks.length || C.giftAddress)) h += `<section class="card rv"><h2 class="script title">Tanda Kasih</h2><p class="small">${esc(C.giftIntro)}</p>` +
      C.banks.map(b => `<div class="bank"><span class="small">${esc(b.bank)}</span><strong>${esc(b.number)}</strong><span class="small">a.n. ${esc(b.name)}</span><br><button class="btn ghost sm" data-copy="${esc(b.number)}">Salin Nomor</button></div>`).join('') +
      (C.giftAddress ? `<div class="bank"><strong style="font-size:18px">Kirim Kado</strong><span class="small">${esc(C.giftAddress)}</span><br><button class="btn ghost sm" data-copy="${esc(C.giftAddress)}">Salin Alamat</button></div>` : '') + `</section>`;

    /* ---------- RSVP / ucapan ---------- */
    if (has('rsvp')) {
      const w = has('wishes');
      h += `<section class="card rv"><h2 class="script title">Konfirmasi Kehadiran</h2>${C.rsvpNote ? `<p class="small">${esc(C.rsvpNote)}</p>` : ''}
      <form data-rsvp>
        <div><label>Nama</label><input name="fn" required value="${H.hasGuest ? esc(H.guest) : ''}"></div>
        <div><label>Kehadiran</label><select name="st">${C.rsvpOptions.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>
        <div><label>Jumlah Tamu</label><select name="fj">${[1, 2, 3, 4, 5].map(n => `<option>${n}</option>`).join('')}</select></div>
        <div><label>Ucapan &amp; Doa</label><textarea name="fm" rows="3"></textarea></div>
        ${w ? `<button class="btn" type="submit">Kirim Konfirmasi</button>` : ''}
        ${C.rsvpPhone ? `<button class="btn ${w ? 'ghost' : ''}" type="${w ? 'button' : 'submit'}" data-act="wa">Kirim via WhatsApp</button>` : ''}
      </form>${w ? `<div class="wishes" data-wishes></div>` : ''}</section>`;
    }

    /* ---------- QR ---------- */
    if (has('qr') && H.hasGuest) h += `<section class="card rv"><h2 class="script title">QR Tamu</h2><p class="small">Tunjukkan QR ini kepada penerima tamu saat tiba.</p><div class="qr" data-qr></div><p class="small"><b>${esc(H.guest)}</b></p></section>`;

    /* ---------- penutup ---------- */
    h += `<section class="card rv"><p class="lead">${esc(C.closingText)}</p><div class="divider"></div><p class="script" style="font-size:54px">${esc(names)}</p>${C.hashtag ? `<p class="small">${esc(C.hashtag)}</p>` : ''}</section></main>`;
    return h;
  },

  /* Elegan: kata muncul satu per satu dari blur halus (diatur di theme.css) */
  after(root) {
    Undangan.splitWords(root,
      '.names, .eyebrow, .guest .to, .guest .nm, .lead, .date, .title, .ev h3, .ev .time, .ev .place, .ev .small, ' +
      '.person h3, .person .small, .tl .yr, .tl .tt, .tl .small, .det b, .det .small, .bank strong, p.small, .script',
      el => el.closest('form') || el.closest('.count') || el.closest('button') || el.closest('a'));
  }
});

</script>
